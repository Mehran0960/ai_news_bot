name: OfferChin Editorial Contract Tests

on:
  pull_request:
    paths:
      - "affilio_radar/editorial_content.py"
      - "affilio_radar/editorial_publisher.py"
      - "affilio_radar/editorial_video.py"
      - "affilio_radar/content_delivery.py"
      - "affilio_radar/publication_policy.py"
      - "affilio_radar/publisher.py"
      - "affilio_radar/affilio_radar.py"
      - "affilio_radar/editorial_bank.json"
      - "affilio_radar/editorial_approved_items.json"
      - "affilio_radar/expiration_monitor.py"
      - "affilio_radar/test_expiration_monitor.py"
      - "affilio_radar/test_content_delivery.py"
      - "affilio_radar/test_editorial_content.py"
      - "affilio_radar/test_editorial_publisher.py"
      - "affilio_radar/merge_state_conflicts.py"
      - "affilio_radar/test_merge_state_conflicts.py"
      - ".github/workflows/offerchin-editorial-shadow.yml"
      - ".github/workflows/offerchin-editorial-contract.yml"
  push:
    branches:
      - main
      - "feat/offerchin-hourly-editorial-fallback-20261112"
    paths:
      - "affilio_radar/editorial_content.py"
      - "affilio_radar/publication_policy.py"
      - "affilio_radar/content_delivery.py"
      - "affilio_radar/publisher.py"
      - "affilio_radar/affilio_radar.py"
      - "affilio_radar/editorial_publisher.py"
      - "affilio_radar/editorial_video.py"
      - "affilio_radar/content_delivery.py"
      - "affilio_radar/publisher.py"
      - "affilio_radar/editorial_bank.json"
      - "affilio_radar/test_editorial_content.py"
      - "affilio_radar/test_editorial_publisher.py"
      - ".github/workflows/offerchin-editorial-contract.yml"

permissions:
  contents: read

jobs:
  editorial-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r affilio_radar/requirements.txt
      - name: Compile editorial delivery modules
        run: |
          python -m py_compile \
            affilio_radar/editorial_content.py \
            affilio_radar/editorial_publisher.py \
            affilio_radar/editorial_video.py \
            affilio_radar/publication_policy.py \
            affilio_radar/content_delivery.py \
            affilio_radar/publisher.py \
            affilio_radar/merge_state_conflicts.py \
            affilio_radar/expiration_monitor.py
      - name: Validate the reviewed evergreen content bank
        working-directory: affilio_radar
        run: |
          python - <<'PY'
          import json
          from editorial_content import validate_editorial_item
          from datetime import datetime, timezone
          with open("editorial_bank.json", encoding="utf-8") as handle:
              bank = json.load(handle)
          with open("editorial_approved_items.json", encoding="utf-8") as handle:
              approved = json.load(handle)
          assert isinstance(bank, list) and isinstance(approved, list)
          items_by_id = {item.get("editorial_id"): item for item in bank + approved}
          items = list(items_by_id.values())
          assert len(items) >= 30
          assert len(items_by_id) == len(items)
          failures = [(item.get("editorial_id"), validate_editorial_item(item, now=datetime.now(timezone.utc))) for item in items]
          invalid = [(name, result) for name, result in failures if not result[0]]
          assert not invalid, invalid
          local_sources = [
              item for item in approved
              if any(str(source.get("publisher") or "") in {"دیجی‌کالا مگ", "زومیت"} for source in item.get("sources", []))
          ]
          assert local_sources, "approved local editorial sources must be included"
          print(f"EDITORIAL_BANK_VALID evergreen={len(bank)} approved={len(approved)} effective={len(items)} local_source_items={len(local_sources)}")
          PY
      - name: Verify scheduled Persian editorial fallback and read-only shadow separation
        run: |
          python - <<'PY'
          from pathlib import Path
          channel = Path(".github/workflows/offerchin-publisher.yml").read_text(encoding="utf-8")
          video = Path(".github/workflows/offerchin-video-publisher.yml").read_text(encoding="utf-8")
          shadow = Path(".github/workflows/offerchin-editorial-shadow.yml").read_text(encoding="utf-8")
          enabled = 'OFFERCHIN_EDITORIAL_PUBLISH_ENABLED: "true"'
          publisher = Path("affilio_radar/editorial_publisher.py").read_text(encoding="utf-8")
          radar = Path("affilio_radar/affilio_radar.py").read_text(encoding="utf-8")
          assert channel.count(enabled) == 2
          assert enabled in video
          assert "OFFERCHIN_EDITORIAL_GAP_MINUTES" not in channel + video + shadow
          delivery = Path("affilio_radar/content_delivery.py").read_text(encoding="utf-8")
          policy = Path("affilio_radar/publication_policy.py").read_text(encoding="utf-8")
          assert "MIN_CHANNEL_POST_INTERVAL_SECONDS = 31 * 60" in policy
          assert "MAX_CHANNEL_POST_INTERVAL_SECONDS = 47 * 60" in policy
          assert "channel_post_interval_seconds" in policy
          assert "PRODUCTS_PER_EDITORIAL_POST = 6" in policy
          assert "DEFAULT_DAILY_CHANNEL_POST_LIMIT = 72" in policy
          assert "MIN_CHANNEL_POST_INTERVAL_SECONDS" in delivery
          assert "channel_publication_wait_seconds" in delivery
          assert "remaining_seconds / candidates" in delivery
          assert "MAX_PRODUCT_PUBLICATION_INTERVAL_SECONDS" in delivery
          assert "shared_variable_31_to_47_minute_channel_spacing_with_product_max_interval_57_minutes" in delivery
          assert "channel_post_interval_seconds" in delivery
          assert "channel_publication_wait_seconds" in publisher
          product_publisher = Path("affilio_radar/publisher.py").read_text(encoding="utf-8")
          assert "channel_post_sent_this_run = False" in product_publisher
          assert "PUBLISHER_STOP_AFTER_CHANNEL_POST" in product_publisher
          assert "never_burst_to_catch_up_missed_slots" in product_publisher
          assert "EDITORIAL_PRODUCT_SLOT_RESERVED" in publisher
          assert "editorial_frequency_allowed(state)" in publisher
          assert "_release_failed_editorial_product_reservation" in publisher
          editorial_policy = Path("docs/OFFERCHIN_DIGIKALA_MAG_SOURCE_POLICY_FA.md").read_text(encoding="utf-8")
          assert "لینک مقاله/ناشر" in editorial_policy
          assert "تحریریه هیچ CTA خرید" in editorial_policy
          assert "۳۱ تا ۴۷ دقیقه" in editorial_policy
          assert "if not next_product:" in publisher
          editorial_module = Path("affilio_radar/editorial_publisher.py").read_text(encoding="utf-8")
          for public_render in ("_editorial_source_rows", "_editorial_affiliate_url", "_editorial_reply_markup"):
              assert public_render not in editorial_module, public_render
          assert "render_editorial_poster(_public_editorial_payload(payload))" in editorial_module
          assert "render_editorial_video(_public_editorial_payload(payload), output_path)" in editorial_module
          assert "No product slot means no editorial wake-up" in radar
          assert "EDITORIAL_SHADOW_ONLY_PUBLIC_PUBLISH_DISABLED" in channel
          assert "EDITORIAL_VIDEO_SHADOW_ONLY_PUBLIC_PUBLISH_DISABLED" in video
          assert "--shadow-report" in shadow
          assert "--publish" not in shadow
          print("EDITORIAL_NONCOMMERCIAL_SHARED_VARIABLE_31_TO_47_MINUTE_SPACING_SIX_TO_ONE_MIX_AND_READ_ONLY_SHADOW")
          PY
      - name: Run the read-only shadow report and prove state is untouched
        run: |
          before="$(sha256sum affilio_radar/state.json | cut -d' ' -f1)"
          python affilio_radar/editorial_publisher.py \
            --shadow-report \
            --report-path "${RUNNER_TEMP}/editorial-shadow-report.json"
          after="$(sha256sum affilio_radar/state.json | cut -d' ' -f1)"
          test "$before" = "$after"
          python - "${RUNNER_TEMP}/editorial-shadow-report.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["public_publish_performed"] is False
          assert report["state_mutated"] is False
          assert report["editorial_bank_valid"] >= 30
          print("EDITORIAL_SHADOW_READ_ONLY_OK")
          PY
      - name: Run editorial content, queue, render and retry tests
        working-directory: affilio_radar
        run: |
          python -m unittest -v \
            test_editorial_content.py \
            test_editorial_publisher.py \
            test_content_delivery.py \
            test_merge_state_conflicts.py

      - name: Verify 48-hour retention with mocked platform deletions
        working-directory: affilio_radar
        run: |
          python -m unittest -v \
            test_expiration_monitor.ExpirationMonitorTests.test_7_day_retention_deletes_product_posts_but_preserves_editorial_and_videos
