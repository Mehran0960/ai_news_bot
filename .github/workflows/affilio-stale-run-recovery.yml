name: Affilio Stale Run Recovery

on:
  push:
    paths:
      - ".github/workflows/affilio-stale-run-recovery.yml"

permissions:
  actions: write
  contents: read

jobs:
  recover-stale-radar:
    if: ${{ contains(github.event.head_commit.message, '[scan-now]') }}
    runs-on: ubuntu-latest
    steps:
      # Immediate recovery trigger: [scan-now] cancels any older in-progress radar run.
      - name: Cancel stale pre-fix OfferChin radar runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const currentSha = context.sha;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "affilio-radar.yml",
              status: "in_progress",
              per_page: 100,
            });

            const staleRuns = data.workflow_runs.filter(
              run => run.status === "in_progress" && run.head_sha !== currentSha
            );

            for (const run of staleRuns) {
              core.warning(
                `Cancelling stale Affilio radar run ${run.id} from ${run.head_sha}`
              );
              await github.rest.actions.cancelWorkflowRun({
                owner,
                repo,
                run_id: run.id,
              });
            }

            core.info(`Stale radar runs cancellation requested: ${staleRuns.length}`);
