name: OfferChin Independent Video Destinations

on:
  # Cloudflare dispatches the coordinator while any selected video destination is pending.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize only coordinator runs. The photo publisher has a different group.
  group: offerchin-video-dispatcher
  cancel-in-progress: false

jobs:
  upload:
    name: Publish ${{ matrix.destination }} independently
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        destination: [youtube, aparat, filo]
    steps:
      - name: Check out current canonical state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100

      - name: Snapshot merge base before this destination works
        run: cp affilio_radar/state.json affilio_radar/state.base.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: affilio_radar/requirements.txt

      - name: Install project dependencies with retries
        run: |
          for attempt in 1 2 3; do
            python -m pip install -r affilio_radar/requirements.txt && break
            if [[ "$attempt" -lt 3 ]]; then
              echo "Dependency install attempt $attempt failed; retrying."
              sleep $((attempt * 3))
            else
              exit 1
            fi
          done

      - name: Install Playwright Chromium for Filo only
        if: matrix.destination == 'filo'
        run: |
          python -m pip install "playwright>=1.48,<2"
          python -m playwright install --with-deps chromium

      - name: Stage official DigiPay logo for video rendering
        continue-on-error: true
        run: |
          mkdir -p affilio_radar/assets/retailer-logos
          curl --fail --silent --show-error --retry 2 --connect-timeout 8 --max-time 30 \
            "https://www.mydigipay.com/bck-assets/images/logos/dp-logo.svg" \
            -o affilio_radar/assets/retailer-logos/digipay-official.svg
          test -s affilio_radar/assets/retailer-logos/digipay-official.svg
          PYTHONPATH=affilio_radar python - <<'PY'
          import offerchin_visuals
          logo = offerchin_visuals._load_digipay_logo()
          assert logo is not None and logo.width > 0 and logo.height > 0
          print("DIGIPAY_OFFICIAL_LOGO_READY_FOR_INDEPENDENT_VIDEO_RENDER")
          PY

      - name: Validate destination adapters and editorial selection
        run: |
          python -m py_compile \
            affilio_radar/affilio_radar.py \
            affilio_radar/short_video.py \
            affilio_radar/offerchin_visuals.py \
            affilio_radar/aparat_uploader.py \
            affilio_radar/filo_uploader.py \
            affilio_radar/editorial_content.py \
            affilio_radar/editorial_publisher.py \
            affilio_radar/merge_video_destination_state.py
          cd affilio_radar
          python -m unittest -v \
            test_shared_selection_media_routing.py \
            test_editorial_content.py \
            test_editorial_publisher.py \
            test_merge_video_destination_state.py

      - name: Verify Filo login without publishing
        id: filo_login
        if: matrix.destination == 'filo'
        continue-on-error: true
        env:
          FILO_USER: ${{ secrets.FILO_USER }}
          FILO_PASS: ${{ secrets.FILO_PASS }}
          PYTHONUNBUFFERED: "1"
        run: python affilio_radar/affilio_radar.py --filo-login-check-only

      - name: Publish the active editorial item to this destination only
        if: matrix.destination != 'filo' || steps.filo_login.outcome == 'success'
        env:
          OFFERCHIN_EDITORIAL_VIDEO_DESTINATION: ${{ matrix.destination }}
          OFFERCHIN_EDITORIAL_PUBLISH_ENABLED: "true"
          OFFERCHIN_EDITORIAL_MAX_ATTEMPTS: "3"
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: "public"
          APARAT_COOKIE_HEADER: ${{ secrets.APARAT_COOKIE_HEADER }}
          AFFILIO_APARAT_UPLOAD_ENABLED: "true"
          APARAT_VIDEO_PASS: "0"
          APARAT_CATEGORY_ID: ${{ vars.APARAT_CATEGORY_ID || '5' }}
          FILO_USER: ${{ secrets.FILO_USER }}
          FILO_PASS: ${{ secrets.FILO_PASS }}
          PYTHONUNBUFFERED: "1"
        run: python affilio_radar/editorial_publisher.py --videos-only --publish

      - name: Publish product videos to this destination only
        if: matrix.destination != 'filo' || steps.filo_login.outcome == 'success'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: "public"
          APARAT_COOKIE_HEADER: ${{ secrets.APARAT_COOKIE_HEADER }}
          AFFILIO_APARAT_UPLOAD_ENABLED: "true"
          APARAT_SHORTS_ONLY: "false"
          APARAT_VIDEO_PASS: "0"
          APARAT_CATEGORY_ID: ${{ vars.APARAT_CATEGORY_ID || '5' }}
          FILO_USER: ${{ secrets.FILO_USER }}
          FILO_PASS: ${{ secrets.FILO_PASS }}
          AFFILIO_YOUTUBE_UPLOAD_INTERVAL_HOURS: "0"
          AFFILIO_APARAT_UPLOAD_INTERVAL_HOURS: "0"
          AFFILIO_FILO_UPLOAD_INTERVAL_HOURS: "0"
          AFFILIO_VIDEO_UPLOAD_CANDIDATE_LIMIT: "250"
          AFFILIO_VIDEO_UPLOAD_MAX_AGE_HOURS: "0"
          AFFILIO_MAX_VIDEO_UPLOAD_ATTEMPTS: "3"
          AFFILIO_MAX_SHORT_VIDEOS_PER_RUN: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          case "${{ matrix.destination }}" in
            youtube) python affilio_radar/affilio_radar.py --youtube-upload-only ;;
            aparat) python affilio_radar/affilio_radar.py --aparat-upload-only ;;
            filo) python affilio_radar/affilio_radar.py --filo-upload-only ;;
            *) echo "Unsupported video destination"; exit 2 ;;
          esac

      - name: Preserve generated video for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offerchin-video-artifacts-${{ matrix.destination }}
          path: video_artifacts/*.mp4
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload destination-scoped state delta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offerchin-video-state-${{ matrix.destination }}
          path: |
            affilio_radar/state.base.json
            affilio_radar/state.json
          if-no-files-found: error
          retention-days: 2

  merge:
    name: Merge independent destination receipts
    if: always()
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest main state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100

      - name: Download independent destination state deltas
        uses: actions/download-artifact@v4
        with:
          pattern: offerchin-video-state-*
          path: ${{ runner.temp }}/offerchin-video-states
          merge-multiple: false

      - name: Merge only destination-scoped state changes
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            if [[ "$attempt" -gt 1 ]]; then
              git fetch origin main
              git reset --hard origin/main
            fi
            python affilio_radar/merge_video_destination_state.py \
              --artifacts-root "${{ runner.temp }}/offerchin-video-states"
            if git diff --quiet -- affilio_radar/state.json affilio_radar/video_upload_dispatch_state.json; then
              echo "NO_VIDEO_STATE_DELTA_TO_COMMIT"
              exit 0
            fi
            git add affilio_radar/state.json affilio_radar/video_upload_dispatch_state.json
            git commit -m "chore: merge independent OfferChin video destination receipts [skip ci]"
            if git push origin HEAD:main; then
              echo "VIDEO_DESTINATION_STATE_MERGED attempt=$attempt"
              exit 0
            fi
            echo "Concurrent main update detected; refreshing and re-merging scoped deltas."
            sleep $((attempt * 2))
          done
          echo "VIDEO_DESTINATION_STATE_MERGE_FAILED"
          exit 1
