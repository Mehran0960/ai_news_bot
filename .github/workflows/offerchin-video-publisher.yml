name: OfferChin Unified Video Publisher

on:
  # One event per selected canonical product queue. Cloudflare also dispatches
  # this workflow as a recovery path while any video destination remains pending.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # The unified runner is the only automatic writer for the three video destinations.
  # It shares the publisher lock because all upload statuses live in state.json.
  group: offerchin-content-publisher
  cancel-in-progress: false

jobs:
  publish-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the latest canonical product and delivery state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: affilio_radar/requirements.txt

      - name: Install project dependencies
        run: |
          for attempt in 1 2 3; do
            python -m pip install -r affilio_radar/requirements.txt && break
            if [[ "$attempt" -lt 3 ]]; then
              echo "Dependency install attempt $attempt failed; retrying."
              sleep $((attempt * 3))
            else
              exit 1
            fi
          done

      - name: Install Playwright Chromium for the Filo adapter
        run: |
          python -m pip install "playwright>=1.48,<2"
          python -m playwright install --with-deps chromium

      - name: Stage official DigiPay logo for matching video cards
        continue-on-error: true
        run: |
          mkdir -p affilio_radar/assets/retailer-logos
          curl --fail --silent --show-error --retry 2 --connect-timeout 8 --max-time 30 \
            "https://www.mydigipay.com/bck-assets/images/logos/dp-logo.svg" \
            -o affilio_radar/assets/retailer-logos/digipay-official.svg
          test -s affilio_radar/assets/retailer-logos/digipay-official.svg
          PYTHONPATH=affilio_radar python - <<'PY'
          import offerchin_visuals
          logo = offerchin_visuals._load_digipay_logo()
          assert logo is not None and logo.width > 0 and logo.height > 0
          print("DIGIPAY_OFFICIAL_LOGO_READY_FOR_UNIFIED_VIDEO_RENDER")
          PY

      - name: Validate the shared FIFO and video upload adapters
        run: |
          python -m py_compile \
            affilio_radar/affilio_radar.py \
            affilio_radar/short_video.py \
            affilio_radar/offerchin_visuals.py \
            affilio_radar/aparat_uploader.py \
            affilio_radar/filo_uploader.py
          cd affilio_radar
          python -m unittest -v \
            test_shared_selection_media_routing.py \
            test_aparat_upload_schedule.py \
            test_filo_upload_schedule.py \
            test_filo_uploader.py \
            test_short_video.py

      - name: Verify Filo login without publishing
        continue-on-error: true
        env:
          FILO_USER: ${{ secrets.FILO_USER }}
          FILO_PASS: ${{ secrets.FILO_PASS }}
          PYTHONUNBUFFERED: "1"
        run: python affilio_radar/affilio_radar.py --filo-login-check-only

      - name: Resume an older editorial video before newer product videos
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: "public"
          APARAT_COOKIE_HEADER: ${{ secrets.APARAT_COOKIE_HEADER }}
          AFFILIO_APARAT_UPLOAD_ENABLED: "true"
          APARAT_VIDEO_PASS: "0"
          APARAT_CATEGORY_ID: ${{ vars.APARAT_CATEGORY_ID || '5' }}
          FILO_USER: ${{ secrets.FILO_USER }}
          FILO_PASS: ${{ secrets.FILO_PASS }}
          OFFERCHIN_EDITORIAL_PRODUCTS_PER_POST: "4"
          OFFERCHIN_EDITORIAL_GAP_MINUTES: "55"
          OFFERCHIN_EDITORIAL_CHANNEL_GAP_MINUTES: "27"
          OFFERCHIN_EDITORIAL_PUBLISH_ENABLED: ${{ vars.OFFERCHIN_EDITORIAL_PUBLISH_ENABLED || 'false' }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [[ "${OFFERCHIN_EDITORIAL_PUBLISH_ENABLED,,}" == "true" ]]; then
            echo "EDITORIAL_VIDEO_FIFO_RESUME_BEFORE_NEWER_PRODUCTS"
            python affilio_radar/editorial_publisher.py --videos-only --resume-active-only --publish
          else
            echo "EDITORIAL_VIDEO_SHADOW_ONLY_PUBLIC_PUBLISH_DISABLED"
            python affilio_radar/editorial_publisher.py --videos-only --resume-active-only
          fi

      - name: Fan out the same FIFO to YouTube, Aparat and Filo
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: "public"
          APARAT_COOKIE_HEADER: ${{ secrets.APARAT_COOKIE_HEADER }}
          AFFILIO_APARAT_UPLOAD_ENABLED: "true"
          APARAT_SHORTS_ONLY: "false"
          APARAT_VIDEO_PASS: "0"
          APARAT_CATEGORY_ID: ${{ vars.APARAT_CATEGORY_ID || '5' }}
          FILO_USER: ${{ secrets.FILO_USER }}
          FILO_PASS: ${{ secrets.FILO_PASS }}
          # Legacy pacing variables are explicitly zero and ignored by the new policy.
          AFFILIO_YOUTUBE_UPLOAD_INTERVAL_HOURS: "0"
          AFFILIO_APARAT_UPLOAD_INTERVAL_HOURS: "0"
          AFFILIO_FILO_UPLOAD_INTERVAL_HOURS: "0"
          AFFILIO_VIDEO_UPLOAD_CANDIDATE_LIMIT: "250"
          AFFILIO_VIDEO_UPLOAD_MAX_AGE_HOURS: "0"
          AFFILIO_MAX_VIDEO_UPLOAD_ATTEMPTS: "3"
          AFFILIO_MAX_SHORT_VIDEOS_PER_RUN: "4"
          PYTHONUNBUFFERED: "1"
        run: python affilio_radar/affilio_radar.py --all-video-upload-only

      - name: Publish the editorial video after older product videos in the shared FIFO
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: "public"
          APARAT_COOKIE_HEADER: ${{ secrets.APARAT_COOKIE_HEADER }}
          AFFILIO_APARAT_UPLOAD_ENABLED: "true"
          APARAT_VIDEO_PASS: "0"
          APARAT_CATEGORY_ID: ${{ vars.APARAT_CATEGORY_ID || '5' }}
          FILO_USER: ${{ secrets.FILO_USER }}
          FILO_PASS: ${{ secrets.FILO_PASS }}
          OFFERCHIN_EDITORIAL_MAX_ATTEMPTS: "3"
          OFFERCHIN_EDITORIAL_PRODUCTS_PER_POST: "4"
          OFFERCHIN_EDITORIAL_GAP_MINUTES: "55"
          OFFERCHIN_EDITORIAL_CHANNEL_GAP_MINUTES: "27"
          OFFERCHIN_EDITORIAL_PUBLISH_ENABLED: ${{ vars.OFFERCHIN_EDITORIAL_PUBLISH_ENABLED || 'false' }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [[ "${OFFERCHIN_EDITORIAL_PUBLISH_ENABLED,,}" == "true" ]]; then
            echo "EDITORIAL_VIDEO_PUBLISH_FEATURE_ENABLED"
            python affilio_radar/editorial_publisher.py --videos-only --publish
          else
            echo "EDITORIAL_VIDEO_SHADOW_ONLY_PUBLIC_PUBLISH_DISABLED"
            python affilio_radar/editorial_publisher.py --videos-only
          fi

      - name: Preserve rendered video artifacts for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offerchin-unified-videos-${{ github.run_id }}
          path: video_artifacts/*.mp4
          if-no-files-found: ignore
          retention-days: 3

      - name: Persist all per-destination outcomes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f affilio_radar/state.json ]] && ! git diff --quiet -- affilio_radar/state.json; then
            git add affilio_radar/state.json
            if [[ -f affilio_radar/video_upload_dispatch_state.json ]]; then
              git add affilio_radar/video_upload_dispatch_state.json
            fi
            git commit -m "chore: persist unified OfferChin video outcomes [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                echo "UNIFIED_VIDEO_STATE_PERSISTED attempt=$attempt"
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "Video state persistence attempt $attempt failed; retrying."
              sleep $((attempt * 2))
            done
            echo "UNIFIED_VIDEO_STATE_PERSIST_FAILED; the next minute-dispatcher run will reconcile pending outcomes."
            exit 1
          else
            echo "No unified video-state changes to persist."
          fi
