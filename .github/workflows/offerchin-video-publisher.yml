name: OfferChin Video Queue Publisher

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # This job writes the same delivery state as the channel publisher and expiry monitor.
  group: offerchin-content-publisher
  cancel-in-progress: false

jobs:
  publish-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the current video queue and delivery state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: affilio_radar/requirements.txt

      - name: Install dependencies with transient-failure retries
        run: |
          for attempt in 1 2 3; do
            python -m pip install -r affilio_radar/requirements.txt && exit 0
            if [[ "$attempt" -lt 3 ]]; then
              echo "Dependency install attempt $attempt failed; retrying."
              sleep $((attempt * 3))
            fi
          done
          exit 1

      - name: Validate the committed offline visual asset library
        run: |
          PYTHONPATH=affilio_radar python - <<'PY'
          import offerchin_visuals
          result = offerchin_visuals.validate_brand_assets()
          print("OFFERCHIN_OFFLINE_ASSET_LIBRARY_OK " + ",".join(result["validated_assets"]))
          PY

      - name: Validate video-only queue path
        run: |
          python -m py_compile affilio_radar/affilio_radar.py affilio_radar/short_video.py affilio_radar/offerchin_visuals.py affilio_radar/aparat_uploader.py
          python - <<'PY'
          from pathlib import Path
          source = Path("affilio_radar/affilio_radar.py").read_text(encoding="utf-8")
          assert "def run_video_uploads_only()" in source
          assert 'destinations={"youtube", "aparat"}' in source
          assert "--video-upload-only" in source
          print("OFFERCHIN_VIDEO_ONLY_PATH_VALIDATED")
          PY

      - name: Publish due videos for already-published channel posts
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: "public"
          APARAT_COOKIE_HEADER: ${{ secrets.APARAT_COOKIE_HEADER }}
          AFFILIO_APARAT_UPLOAD_ENABLED: "true"
          AFFILIO_APARAT_UPLOAD_INTERVAL_HOURS: "4"
          AFFILIO_YOUTUBE_UPLOAD_INTERVAL_HOURS: "4"
          AFFILIO_MAX_SHORT_VIDEOS_PER_RUN: "1"
          AFFILIO_MIN_POST_INTERVAL_HOURS: "6"
          AFFILIO_MAX_DAILY_CHANNEL_POSTS: "4"
          APARAT_SHORTS_ONLY: "false"
          APARAT_VIDEO_PASS: "0"
          APARAT_CATEGORY_ID: ${{ vars.APARAT_CATEGORY_ID || '5' }}
          PYTHONUNBUFFERED: "1"
        run: python affilio_radar/affilio_radar.py --video-upload-only

      - name: Preserve generated MP4 files for short-term diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offerchin-video-queue-${{ github.run_id }}
          path: video_artifacts/*.mp4
          if-no-files-found: ignore
          retention-days: 3

      - name: Persist independent YouTube and Aparat delivery state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f affilio_radar/state.json ]] && ! git diff --quiet -- affilio_radar/state.json; then
            git add affilio_radar/state.json
            git commit -m "chore: persist OfferChin video-only delivery state [skip ci]"
            git reset --hard HEAD
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                echo "VIDEO_QUEUE_STATE_PERSISTED attempt=$attempt"
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "Video queue state persistence attempt $attempt failed; retrying."
              sleep $((attempt * 2))
            done
            echo "VIDEO_QUEUE_STATE_PERSIST_FAILED"
            exit 1
          else
            echo "VIDEO_QUEUE_STATE_UNCHANGED"
          fi
