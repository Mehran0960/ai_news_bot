name: MeMarket Quality Diagnostic

on:
  push:
    paths:
      - ".github/workflows/memarket-quality-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile production script
        run: python -m py_compile memarket_radar/memarket_deal_radar.py
      - name: Analyze current public feed and test filters
        env:
          MEMARKET_AFFILIATE_CODE: \${{ secrets.MEMARKET_AFFILIATE_CODE }}
          DRY_RUN: "true"
        run: python memarket_radar/quality_diagnostic.py
