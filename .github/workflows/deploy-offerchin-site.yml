name: OfferChin Storefront (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "offerchin-site/**"
      - "affilio_radar/candidates.json"
      - "affilio_radar/state.json"
      - ".github/workflows/deploy-offerchin-site.yml"
  workflow_run:
    workflows: ["Affilio Product Radar"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offerchin-cloudflare-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out OfferChin repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect whether the published catalog needs refreshing
        id: detect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(git rev-parse HEAD)"
          required=true

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Manual run requested; forcing a deployment."
          elif [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/offerchin-storefront"
            code="$(curl -sS -o /tmp/pages-project.json -w "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$base" || true)"
            if [[ "$code" == "200" ]]; then
              previous_sha="$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              data = json.loads(Path('/tmp/pages-project.json').read_text(encoding='utf-8'))
              latest = (data.get('result') or {}).get('latest_deployment') or {}
              metadata = (latest.get('deployment_trigger') or {}).get('metadata') or {}
              print(metadata.get('commit_hash') or '')
          except Exception:
              print('')
          PY
              )"
              if [[ -n "$previous_sha" ]] && git cat-file -e "$previous_sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$previous_sha" "$current_sha"; then
                changed_paths="$(git diff --name-only "$previous_sha" "$current_sha" -- offerchin-site affilio_radar/candidates.json affilio_radar/state.json .github/workflows/deploy-offerchin-site.yml)"
                if [[ -z "$changed_paths" ]]; then
                  required=false
                  echo "No relevant source or product-data changes since the last deployment."
                else
                  echo "Relevant changes detected:"
                  echo "$changed_paths"
                fi
              else
                echo "No comparable previous deployment commit; refreshing the catalog."
              fi
            else
              echo "Cloudflare project lookup returned HTTP $code; attempting normal deployment flow."
            fi
          else
            echo "Cloudflare secrets are not present; building and reporting the deployment blocker."
          fi

          echo "deploy_required=$required" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.detect.outputs.deploy_required == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        if: steps.detect.outputs.deploy_required == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build static Persian storefront from current radar state
        if: steps.detect.outputs.deploy_required == 'true'
        run: python offerchin-site/build.py

      - name: Validate generated catalog, safety rules and SEO files
        if: steps.detect.outputs.deploy_required == 'true'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import xml.etree.ElementTree as ET

          dist = Path("offerchin-site/dist")
          feed = json.loads((dist / "products.json").read_text(encoding="utf-8"))
          products = feed.get("products")
          assert isinstance(products, list), "products.json must contain a products list"
          now = datetime.now(timezone.utc)
          ids = set()
          for product in products:
              assert product["product_id"] not in ids, "duplicate product ID"
              ids.add(product["product_id"])
              assert product["availability"] == "in_stock"
              assert product["affiliate_url"].startswith("https://")
              assert product["image_url"].startswith("https://")
              deadline = datetime.fromisoformat(product["active_until"].replace("Z", "+00:00"))
              assert deadline > now, "expired offer included in feed"
          ET.parse(dist / "sitemap.xml")
          assert (dist / "robots.txt").is_file()
          assert (dist / "index.html").is_file()
          print(f"CATALOG_VALID: {len(products)} active product pages")
          PY
          node --check offerchin-site/assets/site.js

      - name: Check whether Cloudflare deployment credentials are present
        if: steps.detect.outputs.deploy_required == 'true'
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials detected."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Catalog build passed, but live deployment was skipped because Cloudflare credentials are not configured."
          fi

      - name: Create Cloudflare Pages project if it does not exist
        if: steps.detect.outputs.deploy_required == 'true' && steps.cloudflare.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          code="$(curl -sS -o /tmp/pages-project.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "$base/offerchin-storefront")"
          if [ "$code" = "200" ]; then
            echo "CLOUDFLARE_PAGES_PROJECT_EXISTS"
          elif [ "$code" = "404" ]; then
            curl -sS --fail-with-body -X POST "$base" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"name":"offerchin-storefront","production_branch":"main"}' \
              -o /tmp/pages-create.json
            echo "CLOUDFLARE_PAGES_PROJECT_CREATED"
          else
            echo "Cloudflare project lookup returned HTTP $code:"
            cat /tmp/pages-project.json
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.detect.outputs.deploy_required == 'true' && steps.cloudflare.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy offerchin-site/dist --project-name offerchin-storefront --branch main

      - name: Skip redundant deployment when source data has not changed
        if: steps.detect.outputs.deploy_required != 'true'
        run: echo "Catalog source and product data are unchanged since the last successful deployment; no new Cloudflare deployment is needed."

      - name: Explain skipped deployment
        if: steps.detect.outputs.deploy_required == 'true' && steps.cloudflare.outputs.ready != 'true'
        run: echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repository Actions secrets, then run this workflow manually to publish the catalog."
