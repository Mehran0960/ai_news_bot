name: OfferChin Fallback Regression Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "affilio_radar/content_delivery.py"
      - "affilio_radar/publisher.py"
      - "affilio_radar/platform_registry.py"
      - "affilio_radar/test_content_delivery.py"
      - "affilio_radar/digikala_mag_discovery.py"
      - "affilio_radar/test_digikala_mag_discovery.py"
      - ".github/workflows/offerchin-mag-source-discovery.yml"
      - ".github/workflows/offerchin-fallback-regression.yml"
  push:
    branches:
      - fix/offerchin-continuous-fallback-20261031
      - fix/offerchin-preserve-fallback-discount-floor-20261031
    paths:
      - "affilio_radar/**"
      - ".github/workflows/offerchin-fallback-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fallback-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r affilio_radar/requirements.txt

      - name: Test delivery queue and same-run fallback
        working-directory: affilio_radar
        run: python -m unittest -v test_content_delivery

      - name: Test cross-band selection and rejected-offer cooldown
        working-directory: affilio_radar
        run: |
          python -m unittest -v \
            test_affilio.AffilioRadarTests.test_all_real_discount_bands_compete_without_a_percentage_or_saving_floor \
            test_affilio.AffilioRadarTests.test_demand_context_precedes_discount_but_clicks_and_synthetic_scores_are_ignored \
            test_affilio.AffilioRadarTests.test_live_page_price_verification_rejects_mismatched_site_price \
            test_affilio.AffilioRadarTests.test_fresh_bestseller_demand_outranks_deadline_urgency_and_a_larger_discount \
            test_affilio.AffilioRadarTests.test_discovery_checks_prioritize_bestseller_demand_before_deadline_and_discount
