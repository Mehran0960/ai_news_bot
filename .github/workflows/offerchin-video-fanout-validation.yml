name: OfferChin Unified Video Fan-out Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "affilio_radar/affilio_radar.py"
      - "affilio_radar/short_video.py"
      - "affilio_radar/aparat_uploader.py"
      - "affilio_radar/filo_uploader.py"
      - "affilio_radar/video_queue_maintenance.py"
      - "affilio_radar/test_video_queue_maintenance.py"
      - "affilio_radar/publisher.py"
      - "affilio_radar/merge_state_conflicts.py"
      - "affilio_radar/test_merge_state_conflicts.py"
      - "affilio_radar/test_independent_media_dispatch.py"
      - "affilio_radar/test_content_delivery.py"
      - "affilio_radar/test_shared_selection_media_routing.py"
      - "affilio_radar/test_affilio.py"
      - "affilio_radar/test_aparat_upload_schedule.py"
      - "affilio_radar/test_filo_upload_schedule.py"
      - "affilio_radar/test_filo_uploader.py"
      - "affilio_radar/test_short_video.py"
      - "affilio_radar/offerchin_four_factor.py"
      - "cloudflare/affilio-minute-dispatcher.js"
      - "cloudflare/affilio-minute-dispatcher.test.mjs"
      - ".github/workflows/offerchin-video-publisher.yml"
      - ".github/workflows/filo-video-upload.yml"
      - ".github/workflows/filo-login-verification.yml"
      - ".github/workflows/youtube-video-upload.yml"
      - ".github/workflows/aparat-video-upload.yml"
      - ".github/workflows/offerchin-publisher.yml"
      - ".github/workflows/affilio-publisher.yml"
      - "affilio_radar/editorial_publisher.py"
      - "affilio_radar/test_content_delivery.py"
      - ".github/workflows/affilio-publisher.yml"
      - ".github/workflows/offerchin-video-fanout-validation.yml"
      - "docs/OFFERCHIN_SHARED_SELECTION_MEDIA_ROUTING_FA.md"
      - "docs/OFFERCHIN_PROJECT_HANDBOOK_FA.md"
      - "docs/CHANGELOG_FA.md"
      - "docs/OFFERCHIN_INDEPENDENT_MEDIA_POLICY_2026-11-17_FA.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: affilio_radar/requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r affilio_radar/requirements.txt

      - name: Compile all video publisher modules
        run: |
          python -m py_compile \
            affilio_radar/affilio_radar.py \
            affilio_radar/short_video.py \
            affilio_radar/offerchin_visuals.py \
            affilio_radar/aparat_uploader.py \
            affilio_radar/filo_uploader.py \
            affilio_radar/video_queue_maintenance.py \
            affilio_radar/offerchin_four_factor.py

      - name: Run unified FIFO, retry, platform and four-factor regressions
        working-directory: affilio_radar
        run: |
          python -m unittest -v \
            test_shared_selection_media_routing.py \
            test_aparat_upload_schedule.py \
            test_filo_upload_schedule.py \
            test_filo_uploader.py \
            test_video_queue_maintenance.py \
            test_short_video.py \
            test_offerchin_four_factor.py

      - name: Validate workflow wiring and absence of legacy video pacing
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("affilio_radar/affilio_radar.py").read_text(encoding="utf-8")
          worker = Path("cloudflare/affilio-minute-dispatcher.js").read_text(encoding="utf-8")
          publisher = Path(".github/workflows/offerchin-publisher.yml").read_text(encoding="utf-8")
          emergency = Path(".github/workflows/affilio-publisher.yml").read_text(encoding="utf-8")
          unified = Path(".github/workflows/offerchin-video-publisher.yml").read_text(encoding="utf-8")

          assert "--all-video-upload-only" in source
          assert "run_all_video_uploads_only" in source
          # The standard product publisher must not start a long video job while
          # it still owns the shared state/concurrency pipeline.
          assert "offerchin-video-publisher.yml" not in publisher
          # Emergency recovery dispatches each video destination separately too.
          assert "youtube-video-upload.yml" in emergency
          assert "aparat-video-upload.yml" in emergency
          assert "filo-video-upload.yml" in emergency
          assert "offerchin-video-publisher.yml" not in emergency
          assert "actions: write" in emergency
          assert "--all-video-upload-only" in unified
          assert "VIDEO_WORKFLOW_RETRY_GAP_MS" not in worker
          assert "VIDEO_UPLOAD_MAX_AGE_MS" not in worker
          assert "dispatchVideoPlatformWhenDue" not in worker
          assert "VIDEO_PUBLISHER_API" not in worker
          assert "videoQueueDispatchDeferReason" in worker
          # Each video platform has its own due check; no channel/editorial slot
          # or active publisher may defer it.
          start = worker.index("async function dispatchVideoUploadsWhenDue")
          end = worker.index("export function hasDueEditorialChannelQueue", start)
          video_dispatch = worker[start:end]
          assert 'hasDueVideoRecord(state, "youtube"' in video_dispatch
          assert 'hasDueVideoRecord(state, "aparat"' in video_dispatch
          assert 'hasDueVideoRecord(state, "filo"' in video_dispatch
          assert "findActiveWorkflow(PUBLISHER_API" not in video_dispatch
          assert "next_channel_content_due_at" not in video_dispatch
          assert "next_editorial_planning_at" not in video_dispatch
          assert "findActiveWorkflow(CATALOG_API" not in video_dispatch
          assert "pending_page_count" not in video_dispatch
          assert "last_cycle_status" not in video_dispatch
          assert "pending_page_count" in worker
          filo = Path(".github/workflows/filo-video-upload.yml").read_text(encoding="utf-8")
          youtube = Path(".github/workflows/youtube-video-upload.yml").read_text(encoding="utf-8")
          aparat = Path(".github/workflows/aparat-video-upload.yml").read_text(encoding="utf-8")
          filo_login = Path(".github/workflows/filo-login-verification.yml").read_text(encoding="utf-8")
          filo_upload = Path(".github/workflows/filo-video-upload.yml").read_text(encoding="utf-8")
          channel_groups = {
              "channel": publisher.split("group: ", 1)[1].splitlines()[0],
              "filo": filo.split("group: ", 1)[1].splitlines()[0],
              "youtube": youtube.split("group: ", 1)[1].splitlines()[0],
              "aparat": aparat.split("group: ", 1)[1].splitlines()[0],
          }
          assert len(set(channel_groups.values())) == 4, channel_groups
          assert "offerchin-content-publisher" not in filo_login
          assert "offerchin-filo-login-state" in filo_login
          assert "\n  push:" not in filo_upload
          print("INDEPENDENT_MEDIA_DISPATCH_WIRING_OK")
          PY
