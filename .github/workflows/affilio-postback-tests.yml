name: Affilio Postback Receiver Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "affilio_radar/affiliate-deal-radar-worker.js"
      - "affilio_radar/test_affiliate_deal_radar_worker.mjs"
      - ".github/workflows/affilio-postback-tests.yml"
  push:
    branches:
      - main
    paths:
      - "affilio_radar/affiliate-deal-radar-worker.js"
      - "affilio_radar/test_affiliate_deal_radar_worker.mjs"
      - ".github/workflows/affilio-postback-tests.yml"

permissions:
  contents: read

jobs:
  postback-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Worker module syntax
        run: |
          cp affilio_radar/affiliate-deal-radar-worker.js affilio_radar/affiliate-deal-radar-worker.mjs
          node --check affilio_radar/affiliate-deal-radar-worker.mjs

      - name: Run click tracker and Affilio postback tests
        run: node --test affilio_radar/test_affiliate_deal_radar_worker.mjs
