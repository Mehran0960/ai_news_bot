name: Instagram follower service watch

on:
  schedule:
    # Every six hours, offset away from the top of the hour to reduce queue delays.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instagram-follower-service-watch
  cancel-in-progress: false

jobs:
  read-only-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read public service pages and prepare report
        run: |
          python instagram_follower_watch/watch.py check --output follower-watch-report.md
          cat follower-watch-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: instagram-follower-watch-report
          path: follower-watch-report.md
          retention-days: 30
