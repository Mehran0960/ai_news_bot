name: Affilio Three Product Test

on:
  push:
    branches: [main]
    paths:
      - "affilio_radar/test_three_product_batch.json"

permissions:
  contents: write

concurrency:
  group: affilio-three-product-test
  cancel-in-progress: false

jobs:
  publish-test-batch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and Persian font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core

      - name: Install Python dependencies
        run: python -m pip install -r affilio_radar/requirements.txt

      - name: Validate code and run test suite
        run: |
          python -m py_compile affilio_radar/affilio_radar.py affilio_radar/publish_three_product_test.py
          cd affilio_radar
          python -m unittest -v test_affilio.py

      - name: Re-check selected products and publish up to three test videos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AFFILIO_LINK_TEMPLATE: ${{ secrets.AFFILIO_LINK_TEMPLATE }}
          AFFILIO_TELEGRAM_CHAT_ID: "@Iran_gajet"
          PYTHONUNBUFFERED: "1"
        run: python affilio_radar/publish_three_product_test.py

      - name: Save one-time test status and publisher cooldown
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add affilio_radar/state.json affilio_radar/candidates.json affilio_radar/test_three_product_batch.json
          if git diff --cached --quiet; then
            echo "No test status changes to commit."
            exit 0
          fi
          git commit -m "chore: save one-time Affilio product test result [skip ci]"
          git pull --rebase origin main
          git push
