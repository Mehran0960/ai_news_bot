name: Dayan Archive Best Product Post

on:
  push:
    paths:
      - ".github/dayan-archive-best-request.txt"

permissions:
  contents: write

# Serialize with the scheduled relay because both workflows update state.json.
concurrency:
  group: dayan-affiliate-relay-live
  cancel-in-progress: false

jobs:
  publish-best:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r dayan-affiliate-relay/requirements.txt

      - name: Publish the highest-demand eligible product from up to 500 recent source posts
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DAYAN_STORE_HOST: ${{ secrets.DAYAN_STORE_HOST }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          request="$(tr -d '[:space:]' < .github/dayan-archive-best-request.txt)"
          if [[ "$request" != "run" ]]; then
            echo "No pending archive request; no Telegram message sent."
            exit 0
          fi

          python -m py_compile dayan-affiliate-relay/relay_botapi.py
          python dayan-affiliate-relay/relay_botapi.py --publish-best-archive

          printf 'sent\n' > .github/dayan-archive-best-request.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dayan-affiliate-relay/state.json .github/dayan-archive-best-request.txt
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Record archive best-product publication [skip ci]"
          git pull --rebase origin main
          git push
