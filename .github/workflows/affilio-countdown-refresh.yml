name: Affilio Countdown Refresh

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/affilio-countdown-refresh.yml"
      - "affilio_radar/affilio_radar.py"

permissions:
  contents: read

concurrency:
  # Emergency button repair has a dedicated group so stale discovery/cleanup queue
  # entries cannot delay restoring the CTA; all normal refreshes remain serialized.
  group: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[restore-purchase-buttons]') && 'affilio-emergency-button-repair' || 'affilio-channel-updates' }}
  cancel-in-progress: false

jobs:
  refresh:
    # Never edit live channel posts from feature branches; run only after the change reaches main.
    # Editing live captions is operational: allow a manual run or an explicitly tagged repair only.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[restore-purchase-buttons]'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r affilio_radar/requirements.txt

      - name: Validate syntax
        run: python -m py_compile affilio_radar/affilio_radar.py

      - name: Migrate captions without countdowns and restore purchase buttons
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AFFILIO_LINK_TEMPLATE: ${{ secrets.AFFILIO_LINK_TEMPLATE }}
          AFFILIO_TELEGRAM_CHAT_ID: "@OfferChin"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          AFFILIO_COUNTDOWN_REFRESH_FORCE: "true" # Retained for workflow compatibility; captions are static
          AFFILIO_COUNTDOWN_SAFETY_BUFFER_MINUTES: "10" # Applies only to verified offer removal
          AFFILIO_DEAL_LIST_PAGES: "5"
          PYTHONUNBUFFERED: "1"
        run: python affilio_radar/affilio_radar.py --refresh-countdowns
