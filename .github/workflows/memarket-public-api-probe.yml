name: MeMarket Public API Probe

on:
  workflow_dispatch:
  push:
    paths:
      - "memarket_radar/channel_probe.py"
      - ".github/workflows/memarket-public-api-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test public API
        run: |
          python - <<'PY'
          import urllib.request
          base="https://shikmarketcontext.ir/api/appid5/"
          tests=[
              "Good/GetStatusActivity",
              "Good/GetGoodParentOnlyWithSellInfoGroupedDetailWithInventory"
          ]
          for p in tests:
              try:
                  req=urllib.request.Request(base+p,headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read().decode("utf-8","ignore")
                      print("TEST",p,"STATUS",r.status,"BYTES",len(body))
                      print("BODY",body[:1500])
              except Exception as e:
                  print("ERROR",p,type(e).__name__,str(e))
          PY
