name: MeMarket Parser Test

on:
  workflow_dispatch:
  push:
    paths:
      - "memarket_radar/channel_probe.py"
      - ".github/workflows/memarket-public-api-probe.yml"

jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Dry run parser
        env:
          MEMARKET_AFFILIATE_CODE: ${{ secrets.MEMARKET_AFFILIATE_CODE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOOTSTRAP_SILENT: "false"
          DRY_RUN: "true"
          STATE_COMMIT: "false"
          MAX_ALERTS: "10"
        run: python memarket_radar/memarket_deal_radar.py
