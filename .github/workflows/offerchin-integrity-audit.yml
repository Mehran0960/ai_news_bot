name: OfferChin Independent Integrity Audit

on:
  # The minute dispatcher launches this workflow off-slot, separately from publishing.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: offerchin-integrity-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out current OfferChin state and audit ledger
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: affilio_radar/requirements.txt

      - name: Install dependencies with transient-failure retries
        run: |
          for attempt in 1 2 3; do
            python -m pip install -r affilio_radar/requirements.txt && exit 0
            if [[ "$attempt" -lt 3 ]]; then
              echo "Dependency install attempt $attempt failed; retrying."
              sleep $((attempt * 3))
            fi
          done
          exit 1

      - name: Validate the isolated audit lane
        run: |
          python -m py_compile affilio_radar/expiration_monitor.py affilio_radar/integrity_audit.py affilio_radar/integrity_audit_state.py
          python - <<'PY'
          from pathlib import Path
          audit = Path("affilio_radar/integrity_audit.py").read_text(encoding="utf-8")
          publisher = Path("affilio_radar/publisher.py").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/offerchin-publisher.yml").read_text(encoding="utf-8")
          assert "monitor._audit_live_prices(" in audit
          assert "publisher_state_write=false" in audit
          assert "apply_integrity_audit_ledger(state)" in publisher
          assert "Audit existing posts and remove verified stale offers" not in workflow
          assert "python affilio_radar/publisher.py" in workflow
          print("OFFERCHIN_INTEGRITY_LANE_ISOLATED_FROM_PUBLISHER")
          PY

      - name: Audit price, discount and stock; retry destination removals independently
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AFFILIO_TELEGRAM_CHAT_ID: "@OfferChin"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          APARAT_COOKIE_HEADER: ${{ secrets.APARAT_COOKIE_HEADER }}
          # Revisit live offers frequently with a smaller bounded batch and bounded request time. This job
          # is isolated from the publisher and may never be made a publisher dependency.
          AFFILIO_PRICE_AUDIT_BATCH_SIZE: "8"
          AFFILIO_PRICE_AUDIT_INTERVAL_SECONDS: "300"
          AFFILIO_PRICE_AUDIT_RETRY_SECONDS: "300"
          AFFILIO_DIRECT_PRODUCT_DETAIL_CHECK_LIMIT: "1"
          AFFILIO_MAX_CHANNEL_EXPIRY_DELETE_ATTEMPTS: "24"
          AFFILIO_MAX_VIDEO_EXPIRY_DELETE_ATTEMPTS: "2"
          AFFILIO_COUNTDOWN_SAFETY_BUFFER_MINUTES: "10"
          AFFILIO_HTTP_TIMEOUT: "8"
          AFFILIO_PRODUCT_STATUS_TIMEOUT_SECONDS: "6"
          PYTHONUNBUFFERED: "1"
        run: timeout --signal=TERM --kill-after=10s 210s python affilio_radar/integrity_audit.py

      - name: Persist audit cadence and per-platform removal results only
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ ! -f affilio_radar/integrity_audit_state.json ]]; then
            echo "INTEGRITY_AUDIT_LEDGER_MISSING"
            exit 1
          fi
          if git diff --quiet -- affilio_radar/integrity_audit_state.json; then
            echo "No integrity-audit ledger changes to persist."
            exit 0
          fi
          git add affilio_radar/integrity_audit_state.json
          git commit -m "chore: persist OfferChin integrity audit ledger [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "INTEGRITY_AUDIT_LEDGER_PERSISTED attempt=$attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Integrity-ledger push attempt $attempt failed; retrying."
            sleep $((attempt * 3))
          done
          echo "INTEGRITY_AUDIT_LEDGER_PERSIST_FAILED"
          exit 1
