name: Affilio Expired Offer Cleanup

on:
  push:
    paths:
      - "affilio_radar/expiration_monitor.py"
      - "affilio_radar/affilio_radar.py"
      - "affilio_radar/test_expiration_monitor.py"
      - "affilio_radar/test_affilio.py"
      - ".github/workflows/affilio-expiration-cleanup.yml"
  # Cloudflare's minute dispatcher launches cleanup at UTC :00/:05/... so this
  # does not depend on GitHub's sometimes-missing native schedule event.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize deletion with publishing to prevent stale runs from overwriting removal state.
  group: affilio-channel-updates
  cancel-in-progress: false

jobs:
  expire:
    # The radar workflow already performs expiry cleanup immediately before its
    # one-time full caption repair. Do not run both channel-mutating jobs concurrently.
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[deadline-audit-only]') || contains(github.event.head_commit.message, '[expiry-cleanup-now]') || contains(github.event.head_commit.message, '[duplicate-cleanup-now]') || contains(github.event.head_commit.message, '[remove-glama-once]') || contains(github.event.head_commit.message, '[repair-buttons-now]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies for one-time caption migration
        run: python -m pip install -r affilio_radar/requirements.txt

      - name: Validate expiry monitor and run its unit tests
        run: |
          python -m py_compile affilio_radar/expiration_monitor.py
          cd affilio_radar
          python -m unittest -v test_expiration_monitor.py

      # [duplicate-cleanup-now] runs only the dedupe branch in expiration_monitor.py.
      - name: Clean up offers with verified expired deadlines
        env:
          AFFILIO_FORCE_DEADLINE_SYNC: ${{ (contains(github.event.head_commit.message, '[deadline-audit-only]') || contains(github.event.head_commit.message, '[repair-all-captions]')) && 'true' || 'false' }}
          AFFILIO_DEDUPLICATE_ONLY: ${{ contains(github.event.head_commit.message, '[duplicate-cleanup-now]') && 'true' || 'false' }}
          # This marker is a one-time manual exception; normal product selection has no exclusion.
          AFFILIO_DELETE_SPECIFIC_PRODUCT_ID: ${{ contains(github.event.head_commit.message, '[remove-glama-once]') && 'dkp-20917779' || '' }}
          AFFILIO_DELETE_SPECIFIC_PRODUCT_TITLE: ${{ contains(github.event.head_commit.message, '[remove-glama-once]') && 'ژل آبرسان صورت گلاما مدل Limited مناسب برای انواع پوست حجم 50 میلی‌لیتر' || '' }}
          AFFILIO_DELETE_SPECIFIC_PRODUCT_TELEGRAM_IDS: ${{ contains(github.event.head_commit.message, '[remove-glama-once]') && '499,500,501,502,503,505' || '' }}
          AFFILIO_DELETE_SPECIFIC_PRODUCT_BALE_IDS: ${{ contains(github.event.head_commit.message, '[remove-glama-once]') && '598,599,600,601,602,603,606' || '' }}
          AFFILIO_DUPLICATE_SCAN_PAGES: "30"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AFFILIO_TELEGRAM_CHAT_ID: "@OfferChin"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          APARAT_COOKIE_HEADER: ${{ secrets.APARAT_COOKIE_HEADER }}
          AFFILIO_DEAL_LIST_PAGES: "5"
          AFFILIO_COUNTDOWN_SAFETY_BUFFER_MINUTES: "10"
          PYTHONUNBUFFERED: "1"
        run: python affilio_radar/expiration_monitor.py

      - name: "One-time migration: remove obsolete timers and restore verified purchase buttons"
        if: ${{ contains(github.event.head_commit.message, '[repair-buttons-now]') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AFFILIO_TELEGRAM_CHAT_ID: "@OfferChin"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          # Captions are static; explicitly restore valid purchase buttons using verified publisher links.
          AFFILIO_COUNTDOWN_REFRESH_FORCE: "true"
          AFFILIO_COUNTDOWN_REFRESH_MAX_RECORDS: ${{ contains(github.event.head_commit.message, '[deadline-audit-only]') && '100' || '80' }}
          AFFILIO_COUNTDOWN_REFRESH_INTERVAL_SECONDS: "240" # Kept for compatibility; schema migration is one-time
          AFFILIO_COUNTDOWN_SAFETY_BUFFER_MINUTES: "10"
          AFFILIO_DEAL_LIST_PAGES: "5"
          PYTHONUNBUFFERED: "1"
        run: |
          if [[ "${{ contains(github.event.head_commit.message, '[repair-all-captions]') }}" == "true" ]]; then
            python affilio_radar/affilio_radar.py --repair-all-captions
          else
            python affilio_radar/affilio_radar.py --refresh-countdowns
          fi
      - name: Commit expiry tracking changes only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add affilio_radar/state.json
          if git diff --cached --quiet; then
            echo "No expiry-state changes."
            exit 0
          fi
          git commit -m "chore(affilio): update offer expiry tracking [skip ci]"
          git pull --rebase origin main
          git push
