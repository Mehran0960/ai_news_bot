name: Affilio Expired Offer Cleanup

on:
  push:
    paths:
      - "affilio_radar/expiration_monitor.py"
      - "affilio_radar/product_quality.py"
      - "affilio_radar/affilio_radar.py"
      - "affilio_radar/test_expiration_monitor.py"
      - "affilio_radar/test_affilio.py"
      - ".github/workflows/affilio-expiration-cleanup.yml"
  # Routine cleanup now runs inside the scheduled publisher job, before delivery.
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expire:
    # Never run live cleanup from a feature-branch push; production cleanup stays on main.
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
    # Manual cleanup is independent; routine cleanup runs inside the delivery workflow.
    concurrency:
      group: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[repair-powerbank-duplicate-once]') || contains(github.event.head_commit.message, '[duplicate-cleanup-product-now]') || contains(github.event.head_commit.message, '[duplicate-cleanup-now]')) && 'offerchin-content-publisher' || 'affilio-channel-updates' }}
      # Only an explicit global dedupe run may preempt a stale publisher lock; routine cleanup remains non-preemptive.
      cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[duplicate-cleanup-now]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: affilio_radar/requirements.txt

      - name: Install dependencies for one-time caption migration (retry transient failures)
        run: |
          for attempt in 1 2 3; do
            python -m pip install -r affilio_radar/requirements.txt && exit 0
            if [[ "$attempt" -lt 3 ]]; then
              echo "Dependency install attempt $attempt failed; retrying."
              sleep $((attempt * 3))
            fi
          done
          exit 1

      - name: Validate expiry-monitor syntax (required for safe deletion)
        run: python -m py_compile affilio_radar/expiration_monitor.py affilio_radar/affilio_radar.py affilio_radar/product_quality.py

      - name: Run expiry-monitor regression tests on code pushes only
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[deadline-audit-only]') && !contains(github.event.head_commit.message, '[expiry-cleanup-now]') && !contains(github.event.head_commit.message, '[duplicate-cleanup-now]') && !contains(github.event.head_commit.message, '[remove-glama-once]') && !contains(github.event.head_commit.message, '[repair-buttons-now]') && !contains(github.event.head_commit.message, '[repair-all-captions]') && !contains(github.event.head_commit.message, '[repair-powerbank-duplicate-once]') && !contains(github.event.head_commit.message, '[duplicate-cleanup-product-now]') }}
        continue-on-error: true
        run: |
          # Tests write state; always restore the live channel ledger after test execution.
          state_backup="$RUNNER_TEMP/offerchin-live-state-before-tests.json"
          cp "$GITHUB_WORKSPACE/affilio_radar/state.json" "$state_backup"
          restore_live_state() {
            cp "$state_backup" "$GITHUB_WORKSPACE/affilio_radar/state.json"
          }
          trap restore_live_state EXIT
          cd affilio_radar
          python -m unittest -v test_expiration_monitor.py

      # [duplicate-cleanup-now] runs global dedupe; [duplicate-cleanup-product-now] limits dedupe to one exact product.
      - name: Clean up offers with verified expired deadlines
        env:
          AFFILIO_FORCE_DEADLINE_SYNC: ${{ (contains(github.event.head_commit.message, '[deadline-audit-only]') || contains(github.event.head_commit.message, '[repair-all-captions]')) && 'true' || 'false' }}
          AFFILIO_DEDUPLICATE_ONLY: ${{ (contains(github.event.head_commit.message, '[duplicate-cleanup-now]') || contains(github.event.head_commit.message, '[duplicate-cleanup-product-now]')) && 'true' || 'false' }}
          AFFILIO_DEDUPLICATE_PRODUCT_ID: ${{ contains(github.event.head_commit.message, '[duplicate-cleanup-product-now]') && 'dkp-21152067' || '' }}
          # This marker is a one-time manual exception; normal product selection has no exclusion.
          AFFILIO_DELETE_SPECIFIC_PRODUCT_ID: ${{ contains(github.event.head_commit.message, '[remove-glama-once]') && 'dkp-20917779' || '' }}
          # Targeted repair of a confirmed duplicate; exact IDs are from the failed state-persistence run.
          AFFILIO_REPAIR_DUPLICATE_PRODUCT_ID: ${{ contains(github.event.head_commit.message, '[repair-powerbank-duplicate-once]') && 'dkp-18524083' || '' }}
          AFFILIO_REPAIR_DUPLICATE_PRODUCT_TITLE: ${{ contains(github.event.head_commit.message, '[repair-powerbank-duplicate-once]') && 'پاوربانک 33 وات شیائومی مدل Integrated Cable ظرفیت 20000 میلی آمپر ساعت - گلوبال' || '' }}
          AFFILIO_REPAIR_DUPLICATE_PRODUCT_URL: ${{ contains(github.event.head_commit.message, '[repair-powerbank-duplicate-once]') && 'https://www.digikala.com/product/dkp-18524083/' || '' }}
          AFFILIO_REPAIR_DUPLICATE_KEEP_TELEGRAM_ID: ${{ contains(github.event.head_commit.message, '[repair-powerbank-duplicate-once]') && '673' || '0' }}
          AFFILIO_REPAIR_DUPLICATE_KEEP_BALE_ID: ${{ contains(github.event.head_commit.message, '[repair-powerbank-duplicate-once]') && '827' || '0' }}
          AFFILIO_REPAIR_DUPLICATE_DELETE_TELEGRAM_ID: ${{ contains(github.event.head_commit.message, '[repair-powerbank-duplicate-once]') && '674' || '0' }}
          AFFILIO_REPAIR_DUPLICATE_DELETE_BALE_ID: ${{ contains(github.event.head_commit.message, '[repair-powerbank-duplicate-once]') && '828' || '0' }}
          AFFILIO_REPAIR_DUPLICATE_POSTED_AT: ${{ contains(github.event.head_commit.message, '[repair-powerbank-duplicate-once]') && '2026-10-25T20:09:12+00:00' || '' }}
          AFFILIO_REPAIR_DUPLICATE_PRICE: ${{ contains(github.event.head_commit.message, '[repair-powerbank-duplicate-once]') && '5700000' || '0' }}
          AFFILIO_REPAIR_DUPLICATE_DISCOUNT: ${{ contains(github.event.head_commit.message, '[repair-powerbank-duplicate-once]') && '37' || '0' }}
          AFFILIO_DELETE_SPECIFIC_PRODUCT_TITLE: ${{ contains(github.event.head_commit.message, '[remove-glama-once]') && 'ژل آبرسان صورت گلاما مدل Limited مناسب برای انواع پوست حجم 50 میلی‌لیتر' || '' }}
          AFFILIO_DELETE_SPECIFIC_PRODUCT_TELEGRAM_IDS: ${{ contains(github.event.head_commit.message, '[remove-glama-once]') && '499,500,501,502,503,505' || '' }}
          AFFILIO_DELETE_SPECIFIC_PRODUCT_BALE_IDS: ${{ contains(github.event.head_commit.message, '[remove-glama-once]') && '598,599,600,601,602,603,606' || '' }}
          AFFILIO_DUPLICATE_SCAN_PAGES: "30"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AFFILIO_TELEGRAM_CHAT_ID: "@OfferChin"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          APARAT_COOKIE_HEADER: ${{ secrets.APARAT_COOKIE_HEADER }}
          AFFILIO_DEAL_LIST_PAGES: "5"
          # Rotate through live offers every run without risking the 15-minute job timeout.
          AFFILIO_PRICE_AUDIT_BATCH_SIZE: "24"
          AFFILIO_PRICE_AUDIT_INTERVAL_SECONDS: "300"
          AFFILIO_PRICE_AUDIT_RETRY_SECONDS: "300"
          AFFILIO_DIRECT_PRODUCT_DETAIL_CHECK_LIMIT: "6"
          # Smaller routine history scans reduce lock duration; deep scans are reserved for repair.
          AFFILIO_PUBLIC_HISTORY_PAGES: ${{ (contains(github.event.head_commit.message, '[repair-buttons-now]') || contains(github.event.head_commit.message, '[repair-all-captions]') || contains(github.event.head_commit.message, '[deadline-audit-only]')) && '10' || '3' }}
          AFFILIO_COUNTDOWN_SAFETY_BUFFER_MINUTES: "10"
          PYTHONUNBUFFERED: "1"
        run: |
          if [[ "${{ contains(github.event.head_commit.message, '[repair-powerbank-duplicate-once]') }}" == "true" ]]; then
            python affilio_radar/expiration_monitor.py --repair-known-duplicate
          elif [[ "${{ contains(github.event.head_commit.message, '[duplicate-cleanup-now]') || contains(github.event.head_commit.message, '[duplicate-cleanup-product-now]') }}" == "true" ]]; then
            # Run the normal dispatcher so AFFILIO_DEDUPLICATE_ONLY and any
            # product-scoped selector are honored instead of being bypassed by
            # the bounded-maintenance CLI flag.
            python affilio_radar/expiration_monitor.py
          else
            python affilio_radar/expiration_monitor.py --bounded-maintenance
          fi

      - name: "One-time migration: remove obsolete timers and restore verified purchase buttons"
        if: ${{ contains(github.event.head_commit.message, '[repair-buttons-now]') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AFFILIO_TELEGRAM_CHAT_ID: "@OfferChin"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          # [repair-buttons-now] Version-10 migration: standardize captions, remove timers, and restore valid purchase buttons.
          AFFILIO_COUNTDOWN_REFRESH_FORCE: "true"
          AFFILIO_COUNTDOWN_REFRESH_MAX_RECORDS: ${{ contains(github.event.head_commit.message, '[deadline-audit-only]') && '100' || '80' }}
          AFFILIO_COUNTDOWN_REFRESH_INTERVAL_SECONDS: "240" # Kept for compatibility; schema migration is one-time
          AFFILIO_COUNTDOWN_SAFETY_BUFFER_MINUTES: "10"
          AFFILIO_DEAL_LIST_PAGES: "5"
          AFFILIO_PUBLIC_HISTORY_PAGES: "10"
          PYTHONUNBUFFERED: "1"
        run: |
          if [[ "${{ contains(github.event.head_commit.message, '[repair-all-captions]') }}" == "true" || "${{ contains(github.event.head_commit.message, '[repair-buttons-now]') }}" == "true" ]]; then
            python affilio_radar/affilio_radar.py --repair-all-captions
          else
            python affilio_radar/affilio_radar.py --refresh-countdowns
          fi
      - name: Commit expiry tracking changes only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add affilio_radar/state.json
          if [[ -f affilio_radar/affiliate_link_repair_report.json ]]; then
            git add affilio_radar/affiliate_link_repair_report.json
          fi
          if git diff --cached --quiet; then
            echo "No expiry-state changes."
            exit 0
          fi
          git commit -m "chore(affilio): update offer expiry tracking [skip ci]"
          # Always reconcile against main, including files generated by the repair command.
          git pull --rebase origin main
          git push
