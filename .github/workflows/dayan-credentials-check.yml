name: Dayan Credentials Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-config:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r dayan-affiliate-relay/requirements.txt

      - name: Check Python syntax
        run: python -m py_compile dayan-affiliate-relay/check_config.py

      - name: Verify secrets, bot access, admin status, and store host without posting
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DAYAN_STORE_HOST: ${{ secrets.DAYAN_STORE_HOST }}
        run: python dayan-affiliate-relay/check_config.py
