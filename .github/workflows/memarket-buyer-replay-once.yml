name: MeMarket One-Time Buyer Offer Replay

on:
  push:
    paths:
      - "memarket_radar/replay-product.txt"

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify current product URL and resend buyer offer
        env:
          MEMARKET_AFFILIATE_CODE: ${{ secrets.MEMARKET_AFFILIATE_CODE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, sys
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          affiliate = os.environ["MEMARKET_AFFILIATE_CODE"].strip()
          bot = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat = os.environ["TELEGRAM_CHAT_ID"].strip()
          product_url = "https://memarket24.ir/product/7307?" + urlencode({"s": affiliate})

          req = Request(product_url, headers={"User-Agent": "Mozilla/5.0 MeMarketDealRadar/2.0"})
          try:
              with urlopen(req, timeout=25) as response:
                  status = response.status
                  final_url = response.geturl()
                  page = response.read(500000).decode("utf-8", "ignore")
          except Exception as exc:
              print(f"RESEND_SKIPPED product_url_check_failed={type(exc).__name__}: {exc}")
              sys.exit(2)

          if status != 200 or "memarket24.ir" not in final_url.lower():
              print(f"RESEND_SKIPPED unexpected_product_response status={status} final_host_check_failed")
              sys.exit(2)

          # Don't claim a current price or stock status; direct the buyer to verify it on the live page.
          text = (
              "🔥 <b>آفر خرید می‌مارکت</b>\n\n"
              "👟 <b>کفش ورزشی</b>\n"
              "طبق آگهی می‌مارکت: «کفش فقط ۱۹۸ تومن» و حراج تا ۵۰٪ تخفیف روی انواع کفش ورزشی.\n\n"
              "⏳ این پیشنهاد در پست اصلی با محدودیت زمان/موجودی اعلام شده بود؛ قیمت و موجودی فعلی را داخل صفحه خرید بررسی کن.\n\n"
              f'🛒 <a href="{product_url}">مشاهده محصول و بررسی قیمت فعلی</a>\n'
              '🔗 <a href="https://t.me/memarket/1923">پست اصلی می‌مارکت</a>'
          )
          data = urlencode({
              "chat_id": chat,
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": "false"
          }).encode()
          telegram_req = Request(
              f"https://api.telegram.org/bot{bot}/sendMessage",
              data=data,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              method="POST"
          )
          with urlopen(telegram_req, timeout=25) as response:
              result = json.loads(response.read().decode("utf-8", "ignore"))
          if not result.get("ok"):
              raise RuntimeError("Telegram API rejected replay message")
          print(f"REPLAY_SENT product_page_status={status} chat_delivery=success")
          PY

      - name: Remove one-time workflow and trigger
        if: always()
        run: |
          rm -f .github/workflows/memarket-buyer-replay-once.yml memarket_radar/replay-product.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/memarket-buyer-replay-once.yml memarket_radar/replay-product.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove one-time buyer offer replay [skip ci]"
            git push
          fi
