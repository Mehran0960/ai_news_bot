name: MeMarket Login Probe

on:
  workflow_dispatch:
  push:
    paths:
      - "memarket_radar/channel_probe.py"
      - ".github/workflows/memarket-login-probe.yml"

jobs:
  login_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect login chunk
        run: |
          python - <<'PY'
          import re, urllib.request
          url="https://aff.memarket24.ir/_nuxt/Db458ClI.js"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          js=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","ignore")
          print("CHUNK_BYTES",len(js))
          for term in ("User/","Login","login","CheckLoginerLoginDetails","CheckSellerLoginDetails","apishared.post(","api.post("):
              print("TERM",term,"COUNT",js.lower().count(term.lower()))
          for term in ("User/","CheckLoginerLoginDetails","CheckSellerLoginDetails"):
              start=0
              count=0
              while count<10:
                  i=js.find(term,start)
                  if i<0: break
                  print("CTX",js[max(0,i-700):i+1000].replace("\\n"," ")[:1700])
                  start=i+len(term)
                  count+=1
          PY
