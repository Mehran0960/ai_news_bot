name: OfferChin Storefront Direct Link Regression

on:
  pull_request:
    paths:
      - "cloudflare/offerchin-site-worker.mjs"
      - "cloudflare/offerchin-site-worker.test.mjs"
      - "cloudflare/wrangler-offerchin-site.toml"
      - "offerchin-site/**"
      - ".github/workflows/offerchin-site-direct-link-regression.yml"
      - "docs/OFFERCHIN_PROJECT_HANDBOOK_FA.md"
      - "docs/CHANGELOG_FA.md"
  push:
    branches: [main]
    paths:
      - "cloudflare/offerchin-site-worker.mjs"
      - "cloudflare/offerchin-site-worker.test.mjs"
      - "cloudflare/wrangler-offerchin-site.toml"
      - "offerchin-site/**"
      - ".github/workflows/offerchin-site-direct-link-regression.yml"
      - "docs/OFFERCHIN_PROJECT_HANDBOOK_FA.md"
      - "docs/CHANGELOG_FA.md"

jobs:
  direct-link-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test storefront validation and ranking
        run: python -m unittest discover -s offerchin-site -p 'test_*.py' -v
      - name: Validate browser and Worker syntax
        run: |
          node --check offerchin-site/assets/site.js
          node --check cloudflare/offerchin-site-worker.mjs
      - name: Test legacy Worker direct purchase URLs
        run: node --test cloudflare/offerchin-site-worker.test.mjs
