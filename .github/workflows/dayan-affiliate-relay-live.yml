name: Dayan Affiliate Relay (live)
# v5.0: push-triggered live stock-markup diagnostic (no post); scheduled runs keep stock/price checks.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dayan-affiliate-relay-live.yml"

permissions:
  contents: write

concurrency:
  group: dayan-affiliate-relay-live
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile dayan-affiliate-relay/relay_botapi.py

      - name: Install OCR and video-frame tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fas ffmpeg

      - name: Install dependencies
        run: python -m pip install -r dayan-affiliate-relay/requirements.txt

      # A push to this workflow is a safe live product-page diagnostic; it never posts.
      - name: Inspect real product stock markup (diagnostic only; no publishing)
        if: github.event_name == 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DAYAN_STORE_HOST: ${{ secrets.DAYAN_STORE_HOST }}
          PYTHONUNBUFFERED: "1"
        run: python dayan-affiliate-relay/relay_botapi.py --debug-stock-page fastcart:45638

      # Scheduled and manually dispatched runs perform the real stock/price-verified relay.
      - name: Rescan the accessible Dayan video archive and publish the highest-demand verified video
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DAYAN_STORE_HOST: ${{ secrets.DAYAN_STORE_HOST }}
          PYTHONUNBUFFERED: "1"
        run: python dayan-affiliate-relay/relay_botapi.py

      - name: Commit relay state only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dayan-affiliate-relay/state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update Dayan affiliate relay state"
          git pull --rebase origin main
          git push
