name: Dayan Affiliate Relay (live)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dayan-affiliate-relay-live
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile dayan-affiliate-relay/relay.py dayan-affiliate-relay/run_relay.py dayan-affiliate-relay/make_session.py

      - name: Install dependencies
        if: vars.DAYAN_AFFILIATE_RELAY_ENABLED == 'true'
        run: python -m pip install -r dayan-affiliate-relay/requirements.txt

      - name: Poll, queue, and publish if a slot is due
        if: vars.DAYAN_AFFILIATE_RELAY_ENABLED == 'true'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
          SOURCE_CHANNEL: Dayan_video
          PYTHONUNBUFFERED: "1"
        run: python dayan-affiliate-relay/run_relay.py

      - name: Explain disabled state
        if: vars.DAYAN_AFFILIATE_RELAY_ENABLED != 'true'
        run: echo "Relay is safely disabled. Configure secrets and affiliate_links.json, then set DAYAN_AFFILIATE_RELAY_ENABLED=true."

      - name: Commit relay state only when changed
        if: vars.DAYAN_AFFILIATE_RELAY_ENABLED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dayan-affiliate-relay/state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update Dayan affiliate relay state"
          git pull --rebase origin main
          git push
