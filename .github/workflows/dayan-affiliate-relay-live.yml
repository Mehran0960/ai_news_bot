name: Dayan Affiliate Relay (live)
# v4.4: no-price videos may publish with live caption pricing; unreadable price claims remain blocked.

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dayan-affiliate-relay-live.yml"

permissions:
  contents: write

concurrency:
  group: dayan-affiliate-relay-live
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m py_compile dayan-affiliate-relay/relay_botapi.py

      - name: Install OCR and video-frame tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fas ffmpeg

      - name: Install dependencies
        run: python -m pip install -r dayan-affiliate-relay/requirements.txt

      # Each cycle rescans up to 500 recent Dayan posts and fills the ranked queue.
      - name: Poll archive, rank candidates, and publish if the half-hour slot is due
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DAYAN_STORE_HOST: ${{ secrets.DAYAN_STORE_HOST }}
          PYTHONUNBUFFERED: "1"
        run: python dayan-affiliate-relay/relay_botapi.py

      - name: Commit relay state only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dayan-affiliate-relay/state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "Update Dayan affiliate relay state"
          git pull --rebase origin main
          git push
