name: OfferChin Messenger Adapter Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "affilio_radar/messenger_adapters.py"
      - "affilio_radar/offerchin_copy.py"
      - "affilio_radar/test_messenger_adapters.py"
      - "affilio_radar/platform_registry.py"
      - "affilio_radar/publisher.py"
      - "affilio_radar/affilio_radar.py"
      - ".github/workflows/offerchin-messenger-adapter-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: affilio_radar/requirements.txt
      - name: Install existing project dependencies
        run: python -m pip install -r affilio_radar/requirements.txt
      - name: Compile and test adapters
        run: |
          python -m py_compile \
            affilio_radar/messenger_adapters.py \
            affilio_radar/platform_registry.py \
            affilio_radar/publisher.py \
            affilio_radar/affilio_radar.py
          cd affilio_radar
          python -m unittest -v test_messenger_adapters.py
