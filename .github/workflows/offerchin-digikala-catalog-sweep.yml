name: OfferChin DigiKala Catalog Sweep

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/offerchin-digikala-catalog-sweep.yml"
      - "affilio_radar/catalog_sweep.py"
      - "affilio_radar/catalog_status_snapshot.py"
      - "affilio_radar/parallel_catalog_sweep.py"
      - "affilio_radar/catalog_sweep_batch_window.py"
      - "affilio_radar/test_catalog_sweep_batch_window.py"
      - "affilio_radar/test_catalog_sweep.py"
      - "affilio_radar/test_catalog_status_snapshot.py"
      - "affilio_radar/test_parallel_catalog_sweep.py"
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/workflows/offerchin-digikala-catalog-sweep.yml"
      - "affilio_radar/catalog_sweep.py"
      - "affilio_radar/catalog_status_snapshot.py"
      - "affilio_radar/parallel_catalog_sweep.py"
      - "affilio_radar/catalog_sweep_batch_window.py"
      - "affilio_radar/test_catalog_sweep_batch_window.py"
      - "affilio_radar/test_catalog_sweep.py"
      - "affilio_radar/test_catalog_status_snapshot.py"
      - "affilio_radar/test_parallel_catalog_sweep.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # PR validation is code-only and must not queue behind the live read-only catalog crawl.
  # Production scan/dispatch keeps the existing shared v3 serialization group.
  group: ${{ github.event_name == 'pull_request' && 'offerchin-digikala-catalog-sweep-pr-v1' || 'offerchin-digikala-catalog-sweep-v3' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the pull request source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install catalog and product-parser dependencies
        run: python -m pip install --disable-pip-version-check -r affilio_radar/requirements.txt
      - name: Validate catalog scanner and status snapshot
        run: |
          python -m py_compile affilio_radar/catalog_sweep.py affilio_radar/catalog_status_snapshot.py affilio_radar/parallel_catalog_sweep.py affilio_radar/catalog_sweep_batch_window.py affilio_radar/product_quality.py
          python -m unittest affilio_radar.test_catalog_sweep affilio_radar.test_catalog_status_snapshot affilio_radar.test_parallel_catalog_sweep affilio_radar.test_catalog_sweep_batch_window -v

      - name: Read-only smoke test for live DigiKala product details
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          PYTHONPATH=affilio_radar python - <<'PY'
          import time
          import affilio_radar as radar

          # IDs were returned by today's read-only publisher discovery run.
          candidate_ids = [
              "23035367", "23028678", "23026530", "22917067", "22902723",
              "22895145", "22740975", "22630463", "22527108", "22485094",
          ]
          verified = []
          failures = []

          for numeric_id in candidate_ids:
              product_id = f"dkp-{numeric_id}"
              product_url = f"https://www.digikala.com/product/{product_id}/"
              endpoint = radar.DIGIKALA_PRODUCT_DETAIL_API_URL.format(product_id=numeric_id)
              try:
                  response = radar._digikala_get(endpoint, timeout=15)
                  if not response.ok:
                      status = int(getattr(response, "status_code", 0) or 0)
                      failures.append(f"{product_id}:http_{status}")
                      print(f"DETAIL_SMOKE_HTTP product={product_id} status={status}")
                      time.sleep(0.3)
                      continue

                  record = radar.parse_product_api(response.json(), product_url)
                  identity_ok = record.get("product_id") == product_id
                  title_ok = radar.is_publishable_product_title(record.get("title"))
                  price_ok = int(record.get("current_price") or 0) > 0
                  stock = record.get("availability")
                  stock_ok = stock in {"in_stock", "out_of_stock"}
                  if identity_ok and title_ok and price_ok and stock_ok:
                      verified.append(product_id)
                      print(
                          f"DETAIL_SMOKE_VERIFIED product={product_id} "
                          f"price_present=true stock={stock} "
                          f"review_count={record.get('review_count', 0)}"
                      )
                      break

                  failures.append(
                      f"{product_id}:unusable identity={identity_ok} "
                      f"title={title_ok} price={price_ok} stock={stock}"
                  )
                  print(
                      f"DETAIL_SMOKE_UNUSABLE product={product_id} "
                      f"identity={identity_ok} title={title_ok} "
                      f"price={price_ok} stock={stock}"
                  )
              except Exception as exc:
                  failures.append(f"{product_id}:{type(exc).__name__}")
                  print(f"DETAIL_SMOKE_ERROR product={product_id} error={type(exc).__name__}")
              time.sleep(0.3)

          print(
              f"DETAIL_SMOKE_SUMMARY verified={len(verified)} "
              f"attempted={len(candidate_ids)}"
          )
          if not verified:
              print("DETAIL_SMOKE_FAILURES " + ";".join(failures))
              raise SystemExit(
                  "No current product detail response passed exact SKU, title, price "
                  "and stock checks. Publication must remain fail-closed."
              )
          PY

  catalog-sweep:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out catalog cursor and candidate queue
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight crawler dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Validate crawler syntax
        run: python -m py_compile affilio_radar/catalog_sweep.py affilio_radar/catalog_status_snapshot.py affilio_radar/parallel_catalog_sweep.py affilio_radar/catalog_sweep_batch_window.py affilio_radar/product_quality.py

      - name: Run crawler regressions on code pushes only
        if: ${{ github.event_name == 'push' }}
        run: python -m unittest affilio_radar.test_catalog_sweep affilio_radar.test_catalog_status_snapshot affilio_radar.test_parallel_catalog_sweep affilio_radar.test_catalog_sweep_batch_window -v

      - name: Verify DigiKala Discovery API before touching catalog checkpoints
        run: python -m affilio_radar.catalog_sweep --validate-api

      - name: Sweep catalog in three controlled 480-page batches (no page-depth cap)
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m affilio_radar.catalog_sweep_batch_window --pages-per-batch 480 --workers 16 --batches 3

      - name: Write compact catalog-cycle status for the publication gate
        if: always()
        run: python affilio_radar/catalog_status_snapshot.py

      - name: Persist resumable page queue and unacknowledged product candidates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add affilio_radar/catalog_sweep_state.json affilio_radar/catalog_sweep_candidates.json
          if [[ -f affilio_radar/catalog_sweep_completed_candidates.json ]]; then git add affilio_radar/catalog_sweep_completed_candidates.json; fi
          if [[ -f affilio_radar/catalog_sweep_status.json ]]; then git add affilio_radar/catalog_sweep_status.json; fi
          if git diff --cached --quiet; then
            echo "CATALOG_SWEEP_STATE_UNCHANGED"
            exit 0
          fi
          git commit -m "chore: checkpoint OfferChin DigiKala parallel sweep [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "CATALOG_SWEEP_STATE_PERSISTED attempt=$attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Catalog sweep persistence attempt $attempt failed; retrying."
            sleep $((attempt * 2))
          done
          echo "CATALOG_SWEEP_STATE_PERSIST_FAILED"
          exit 1
