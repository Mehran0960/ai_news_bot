name: OfferChin DigiKala Catalog Sweep

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/offerchin-digikala-catalog-sweep.yml"
      - "affilio_radar/catalog_sweep.py"
      - "affilio_radar/parallel_catalog_sweep.py"
      - "affilio_radar/test_catalog_sweep.py"
      - "affilio_radar/test_parallel_catalog_sweep.py"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: offerchin-digikala-catalog-sweep
  cancel-in-progress: false

jobs:
  catalog-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out catalog cursor and candidate queue
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight crawler dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Validate crawler syntax
        run: python -m py_compile affilio_radar/catalog_sweep.py affilio_radar/parallel_catalog_sweep.py affilio_radar/product_quality.py

      - name: Run crawler regressions outside routine scheduled sweeps
        if: ${{ github.event_name != 'schedule' }}
        run: python -m unittest affilio_radar.test_catalog_sweep affilio_radar.test_parallel_catalog_sweep -v

      - name: Sweep catalog pages concurrently
        env:
          PYTHONUNBUFFERED: "1"
        run: python affilio_radar/parallel_catalog_sweep.py --pages-per-run 480 --workers 12

      - name: Persist resumable page queue and unacknowledged product candidates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add affilio_radar/catalog_sweep_state.json affilio_radar/catalog_sweep_candidates.json
          if git diff --cached --quiet; then
            echo "CATALOG_SWEEP_STATE_UNCHANGED"
            exit 0
          fi
          git commit -m "chore: checkpoint OfferChin DigiKala parallel sweep [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "CATALOG_SWEEP_STATE_PERSISTED attempt=$attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Catalog sweep persistence attempt $attempt failed; retrying."
            sleep $((attempt * 2))
          done
          echo "CATALOG_SWEEP_STATE_PERSIST_FAILED"
          exit 1
