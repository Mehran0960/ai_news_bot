name: OfferChin DigiKala Catalog Sweep

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/offerchin-digikala-catalog-sweep.yml"
      - "affilio_radar/catalog_sweep.py"
      - "affilio_radar/catalog_status_snapshot.py"
      - "affilio_radar/parallel_catalog_sweep.py"
      - "affilio_radar/catalog_sweep_batch_window.py"
      - "affilio_radar/test_catalog_sweep_batch_window.py"
      - "affilio_radar/test_catalog_sweep.py"
      - "affilio_radar/test_catalog_status_snapshot.py"
      - "affilio_radar/test_parallel_catalog_sweep.py"
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/workflows/offerchin-digikala-catalog-sweep.yml"
      - "affilio_radar/catalog_sweep.py"
      - "affilio_radar/catalog_status_snapshot.py"
      - "affilio_radar/parallel_catalog_sweep.py"
      - "affilio_radar/catalog_sweep_batch_window.py"
      - "affilio_radar/test_catalog_sweep_batch_window.py"
      - "affilio_radar/test_catalog_sweep.py"
      - "affilio_radar/test_catalog_status_snapshot.py"
      - "affilio_radar/test_parallel_catalog_sweep.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # PR validation is code-only and must not queue behind the live read-only catalog crawl.
  # Production scan/dispatch keeps the existing shared v3 serialization group.
  group: ${{ github.event_name == 'pull_request' && 'offerchin-digikala-catalog-sweep-pr-v1' || 'offerchin-digikala-catalog-sweep-v3' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the pull request source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight crawler dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Probe live DigiKala category endpoints (read-only)
        run: |
          python - <<'PY'
          import requests
          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128 Safari/537.36",
              "Accept": "application/json,text/plain,*/*",
              "Accept-Language": "fa-IR,fa;q=0.9,en;q=0.7",
              "Referer": "https://www.digikala.com/",
          })
          def probe(label, url, params=None):
              try:
                  response = session.get(url, params=params or {}, timeout=(5, 18))
                  result = {
                      "status": response.status_code,
                      "content_type": response.headers.get("content-type", ""),
                      "server": response.headers.get("server", ""),
                      "via": response.headers.get("via", ""),
                      "response_preview": response.text[:180].replace("\\n", " ")
                  }
                  try:
                      payload = response.json()
                      result["top_keys"] = sorted(payload.keys())[:20] if isinstance(payload, dict) else []
                      if isinstance(payload, dict):
                          for key in ("message", "detail", "error", "status"):
                              value = payload.get(key)
                              if isinstance(value, (str, int, bool)):
                                  result[key] = str(value)[:100]
                          data = payload.get("data")
                          if isinstance(data, dict):
                              result["data_keys"] = sorted(data.keys())[:20]
                              pager = data.get("pager")
                              result["pager_keys"] = sorted(pager.keys()) if isinstance(pager, dict) else []
                              widgets = data.get("widgets")
                              result["widget_types"] = [w.get("type") for w in widgets[:20] if isinstance(w, dict)] if isinstance(widgets, list) else []
                              count = 0
                              if isinstance(widgets, list):
                                  for item in widgets:
                                      nested = item.get("data", {}) if isinstance(item, dict) else {}
                                      nested_widgets = nested.get("widgets", []) if isinstance(nested, dict) else []
                                      count += sum(1 for w in nested_widgets if isinstance(w, dict) and w.get("type") == "product") if isinstance(nested_widgets, list) else 0
                              products = data.get("products")
                              if isinstance(products, list):
                                  count += sum(1 for item in products if isinstance(item, dict))
                              result["product_widget_count"] = count
                  except Exception as exc:
                      result["json_error"] = type(exc).__name__
                  print("DIGIKALA_ENDPOINT_PROBE " + label + " " + str(result))
                  return response, payload if 'payload' in locals() else None
              except Exception as exc:
                  print("DIGIKALA_ENDPOINT_PROBE " + label + " error=" + type(exc).__name__)
                  return None, None

          dict_params = [("types[0]", "category_tree"), ("hashes[0]", "")]
          dict_response, dict_payload = probe("category_dictionary", "https://api.digikala.com/v1/dictionaries/", dict_params)
          category_ids = []
          def walk(value):
              if isinstance(value, dict):
                  raw = value.get("id")
                  if raw is not None and str(raw).isdigit():
                      category_ids.append(str(raw))
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          if isinstance(dict_payload, dict):
              walk(dict_payload.get("data", {}).get("category_tree", []))
          category_ids = list(dict.fromkeys(category_ids))
          selected_ids = category_ids[:8] if category_ids else ["14", "19", "20", "77"]
          print("DIGIKALA_CATEGORY_DICTIONARY_IDS " + str(selected_ids))
          for category_id in selected_ids:
              probe("v2_no_q_" + category_id, "https://api.digikala.com/v2/category/" + category_id + "/", {"page": 1, "sort": 5})
          probe("v2_q_19", "https://api.digikala.com/v2/category/19/", {"q": "گوشی پوکو", "page": 1, "sort": 5})
          probe("v1_search_19", "https://api.digikala.com/v1/search/", {"categories[]": "19", "page": 1, "sort": 7})
          # Additional documented crawler variants; these are probes only until a response is verified.
          probe("discovery_category_3", "https://api.digikala.com/discovery/api/v2/categories/3/products/", {"page": 1})
          probe("discovery_category_19", "https://api.digikala.com/discovery/api/v2/categories/19/products/", {"page": 1})
          probe("v1_category_search_3", "https://api.digikala.com/v1/categories/3/search/", {"page": 1, "sort": 5, "q": "گوشی"})
          probe("v1_category_search_19", "https://api.digikala.com/v1/categories/19/search/", {"page": 1, "sort": 5, "q": "گوشی"})
          probe("v3_search_q", "https://api.digikala.com/v3/search/", {"q": "گوشی پوکو", "page": 1, "sort": 5})

          # Do not let a syntactically valid but unverified route pass this PR.
          # The scan can only migrate after a real 200 response includes product cards.
          import sys
          verified_routes = []
          for label, url, params in [
              ("discovery_category_3", "https://api.digikala.com/discovery/api/v2/categories/3/products/", {"page": 1}),
              ("discovery_category_19", "https://api.digikala.com/discovery/api/v2/categories/19/products/", {"page": 1}),
              ("v1_category_search_3", "https://api.digikala.com/v1/categories/3/search/", {"page": 1, "sort": 5, "q": "گوشی"}),
              ("v1_category_search_19", "https://api.digikala.com/v1/categories/19/search/", {"page": 1, "sort": 5, "q": "گوشی"}),
              ("v3_search_q", "https://api.digikala.com/v3/search/", {"q": "گوشی پوکو", "page": 1, "sort": 5}),
          ]:
              try:
                  response = session.get(url, params=params, timeout=(5, 18))
                  payload = response.json() if response.status_code == 200 else {}
                  data = payload.get("data", {}) if isinstance(payload, dict) else {}
                  count = len(data.get("products", [])) if isinstance(data, dict) and isinstance(data.get("products"), list) else 0
                  widgets = data.get("widgets", []) if isinstance(data, dict) else []
                  if isinstance(widgets, list):
                      for widget in widgets:
                          nested = widget.get("data", {}) if isinstance(widget, dict) else {}
                          nested_widgets = nested.get("widgets", []) if isinstance(nested, dict) else []
                          if isinstance(nested_widgets, list):
                              count += sum(1 for item in nested_widgets if isinstance(item, dict) and item.get("type") == "product")
                  if response.status_code == 200 and count > 0:
                      verified_routes.append(label)
              except Exception:
                  pass
          print("DIGIKALA_VERIFIED_LISTING_ROUTES " + str(verified_routes))
          if not verified_routes:
              raise SystemExit("No candidate DigiKala listing endpoint returned HTTP 200 with product cards; keep production scanner unchanged.")

          def mcp_probe(label, tool_name, arguments_):
              try:
                  response = session.post(
                      "https://digikala-mcp.mmdju.workers.dev/mcp",
                      headers={"content-type": "application/json", "accept": "application/json, text/event-stream"},
                      json={
                          "jsonrpc": "2.0",
                          "id": 1,
                          "method": "tools/call",
                          "params": {"name": tool_name, "arguments": arguments_},
                      },
                      timeout=(8, 25),
                  )
                  payload = None
                  for line in response.text.splitlines():
                      if line.startswith("data:"):
                          try:
                              payload = __import__("json").loads(line[5:].strip())
                              break
                          except Exception:
                              pass
                  if payload is None:
                      try:
                          payload = response.json()
                      except Exception:
                          payload = None
                  summary = {
                      "status": response.status_code,
                      "content_type": response.headers.get("content-type", ""),
                      "body_length": len(response.text),
                  }
                  if isinstance(payload, dict):
                      summary["jsonrpc_error"] = payload.get("error")
                      result = payload.get("result", {})
                      if isinstance(result, dict):
                          summary["is_error"] = result.get("isError")
                          content = result.get("content", [])
                          summary["content_types"] = [item.get("type") for item in content if isinstance(item, dict)]
                          text_content = " ".join(item.get("text", "") for item in content if isinstance(item, dict) and isinstance(item.get("text"), str))
                          summary["product_url_count"] = text_content.count("digikala.com/product/dkp-")
                          summary["text_preview"] = text_content[:220].replace("\n", " ")
                  print("DIGIKALA_PUBLIC_MCP_PROXY_PROBE " + label + " " + str(summary))
              except Exception as exc:
                  print("DIGIKALA_PUBLIC_MCP_PROXY_PROBE " + label + " error=" + type(exc).__name__)

          mcp_probe("suggest_phones", "digikala_suggest", {"query": "گوشی", "limit": 5})
          mcp_probe("search_headphones", "search_digikala", {"query": "هدفون بی سیم", "sort": "best_selling", "page": 1, "limit": 3})
          mcp_probe("browse_mobile_11", "browse_category", {"category_id": 11, "sort": "best_selling", "page": 1, "limit": 3})
          mcp_probe("browse_poco_19", "browse_category", {"category_id": 19, "sort": "best_selling", "page": 1, "limit": 3})
          PY
      - name: Validate catalog scanner and status snapshot
        run: |
          python -m py_compile affilio_radar/catalog_sweep.py affilio_radar/catalog_status_snapshot.py affilio_radar/parallel_catalog_sweep.py affilio_radar/catalog_sweep_batch_window.py affilio_radar/product_quality.py
          python -m unittest affilio_radar.test_catalog_sweep affilio_radar.test_catalog_status_snapshot affilio_radar.test_parallel_catalog_sweep affilio_radar.test_catalog_sweep_batch_window -v

  catalog-sweep:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out catalog cursor and candidate queue
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight crawler dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Validate crawler syntax
        run: python -m py_compile affilio_radar/catalog_sweep.py affilio_radar/catalog_status_snapshot.py affilio_radar/parallel_catalog_sweep.py affilio_radar/catalog_sweep_batch_window.py affilio_radar/product_quality.py

      - name: Run crawler regressions on code pushes only
        if: ${{ github.event_name == 'push' }}
        run: python -m unittest affilio_radar.test_catalog_sweep affilio_radar.test_catalog_status_snapshot affilio_radar.test_parallel_catalog_sweep affilio_radar.test_catalog_sweep_batch_window -v

      - name: Sweep catalog in three controlled 480-page batches (no page-depth cap)
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m affilio_radar.catalog_sweep_batch_window --pages-per-batch 480 --workers 16 --batches 3

      - name: Write compact catalog-cycle status for the publication gate
        if: always()
        run: python affilio_radar/catalog_status_snapshot.py

      - name: Persist resumable page queue and unacknowledged product candidates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add affilio_radar/catalog_sweep_state.json affilio_radar/catalog_sweep_candidates.json
          if [[ -f affilio_radar/catalog_sweep_completed_candidates.json ]]; then git add affilio_radar/catalog_sweep_completed_candidates.json; fi
          if [[ -f affilio_radar/catalog_sweep_status.json ]]; then git add affilio_radar/catalog_sweep_status.json; fi
          if git diff --cached --quiet; then
            echo "CATALOG_SWEEP_STATE_UNCHANGED"
            exit 0
          fi
          git commit -m "chore: checkpoint OfferChin DigiKala parallel sweep [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "CATALOG_SWEEP_STATE_PERSISTED attempt=$attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Catalog sweep persistence attempt $attempt failed; retrying."
            sleep $((attempt * 2))
          done
          echo "CATALOG_SWEEP_STATE_PERSIST_FAILED"
          exit 1
