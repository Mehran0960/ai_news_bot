name: OfferChin DigiKala Catalog Sweep

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/offerchin-digikala-catalog-sweep.yml"
      - "affilio_radar/catalog_sweep.py"
      - "affilio_radar/catalog_status_snapshot.py"
      - "affilio_radar/parallel_catalog_sweep.py"
      - "affilio_radar/catalog_sweep_batch_window.py"
      - "affilio_radar/test_catalog_sweep_batch_window.py"
      - "affilio_radar/test_catalog_sweep.py"
      - "affilio_radar/test_catalog_status_snapshot.py"
      - "affilio_radar/test_parallel_catalog_sweep.py"
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/workflows/offerchin-digikala-catalog-sweep.yml"
      - "affilio_radar/catalog_sweep.py"
      - "affilio_radar/catalog_status_snapshot.py"
      - "affilio_radar/parallel_catalog_sweep.py"
      - "affilio_radar/catalog_sweep_batch_window.py"
      - "affilio_radar/test_catalog_sweep_batch_window.py"
      - "affilio_radar/test_catalog_sweep.py"
      - "affilio_radar/test_catalog_status_snapshot.py"
      - "affilio_radar/test_parallel_catalog_sweep.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # PR validation is code-only and must not queue behind the live read-only catalog crawl.
  # Production scan/dispatch keeps the existing shared v3 serialization group.
  group: ${{ github.event_name == 'pull_request' && 'offerchin-digikala-catalog-sweep-pr-v1' || 'offerchin-digikala-catalog-sweep-v3' }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the pull request source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight crawler dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Probe live DigiKala category endpoints (read-only)
        run: |
          python - <<'PY'
          import requests
          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128 Safari/537.36",
              "Accept": "application/json,text/plain,*/*",
              "Accept-Language": "fa-IR,fa;q=0.9,en;q=0.7",
              "Referer": "https://www.digikala.com/",
          })
          probes = [
              ("v2_category_no_query", "https://api.digikala.com/v2/category/19/", {"page": 1, "sort": 5}),
              ("v2_category_with_query", "https://api.digikala.com/v2/category/19/", {"q": "گوشی پوکو", "page": 1, "sort": 5}),
              ("v1_search_legacy", "https://api.digikala.com/v1/search/", {"categories[]": "19", "page": 1, "sort": 7}),
          ]
          for label, url, params in probes:
              try:
                  response = session.get(url, params=params, timeout=(5, 18))
                  shape = {"status": response.status_code, "content_type": response.headers.get("content-type", "")}
                  try:
                      payload = response.json()
                      data = payload.get("data", {}) if isinstance(payload, dict) else {}
                      widgets = data.get("widgets", []) if isinstance(data, dict) else []
                      listing = next((w for w in widgets if isinstance(w, dict) and w.get("type") == "vertical_product_listing"), {})
                      nested = listing.get("data", {}) if isinstance(listing, dict) else {}
                      product_widgets = [w for w in nested.get("widgets", []) if isinstance(w, dict) and w.get("type") == "product"] if isinstance(nested, dict) else []
                      pager = data.get("pager") if isinstance(data, dict) else None
                      shape.update({"data_keys": sorted(data.keys())[:20] if isinstance(data, dict) else [], "widget_types": [w.get("type") for w in widgets[:20] if isinstance(w, dict)], "product_widget_count": len(product_widgets), "pager_keys": sorted(pager.keys()) if isinstance(pager, dict) else []})
                  except Exception as exc:
                      shape["json_error"] = type(exc).__name__
                  print("DIGIKALA_ENDPOINT_PROBE " + label + " " + str(shape))
              except Exception as exc:
                  print("DIGIKALA_ENDPOINT_PROBE " + label + " error=" + type(exc).__name__)
          PY
      - name: Validate catalog scanner and status snapshot
        run: |
          python -m py_compile affilio_radar/catalog_sweep.py affilio_radar/catalog_status_snapshot.py affilio_radar/parallel_catalog_sweep.py affilio_radar/catalog_sweep_batch_window.py affilio_radar/product_quality.py
          python -m unittest affilio_radar.test_catalog_sweep affilio_radar.test_catalog_status_snapshot affilio_radar.test_parallel_catalog_sweep affilio_radar.test_catalog_sweep_batch_window -v

  catalog-sweep:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out catalog cursor and candidate queue
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight crawler dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Validate crawler syntax
        run: python -m py_compile affilio_radar/catalog_sweep.py affilio_radar/catalog_status_snapshot.py affilio_radar/parallel_catalog_sweep.py affilio_radar/catalog_sweep_batch_window.py affilio_radar/product_quality.py

      - name: Run crawler regressions on code pushes only
        if: ${{ github.event_name == 'push' }}
        run: python -m unittest affilio_radar.test_catalog_sweep affilio_radar.test_catalog_status_snapshot affilio_radar.test_parallel_catalog_sweep affilio_radar.test_catalog_sweep_batch_window -v

      - name: Sweep catalog in three controlled 480-page batches (no page-depth cap)
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m affilio_radar.catalog_sweep_batch_window --pages-per-batch 480 --workers 16 --batches 3

      - name: Write compact catalog-cycle status for the publication gate
        if: always()
        run: python affilio_radar/catalog_status_snapshot.py

      - name: Persist resumable page queue and unacknowledged product candidates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add affilio_radar/catalog_sweep_state.json affilio_radar/catalog_sweep_candidates.json
          if [[ -f affilio_radar/catalog_sweep_completed_candidates.json ]]; then git add affilio_radar/catalog_sweep_completed_candidates.json; fi
          if [[ -f affilio_radar/catalog_sweep_status.json ]]; then git add affilio_radar/catalog_sweep_status.json; fi
          if git diff --cached --quiet; then
            echo "CATALOG_SWEEP_STATE_UNCHANGED"
            exit 0
          fi
          git commit -m "chore: checkpoint OfferChin DigiKala parallel sweep [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "CATALOG_SWEEP_STATE_PERSISTED attempt=$attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Catalog sweep persistence attempt $attempt failed; retrying."
            sleep $((attempt * 2))
          done
          echo "CATALOG_SWEEP_STATE_PERSIST_FAILED"
          exit 1
