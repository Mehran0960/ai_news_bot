name: OfferChin Catalog Sweep Regression Tests

on:
  pull_request:
    paths:
      - "affilio_radar/catalog_sweep.py"
      - "affilio_radar/parallel_catalog_sweep.py"
      - "affilio_radar/test_catalog_sweep.py"
      - "affilio_radar/test_parallel_catalog_sweep.py"
      - "affilio_radar/affilio_radar.py"
      - ".github/workflows/offerchin-digikala-catalog-sweep.yml"
      - ".github/workflows/offerchin-catalog-sweep-tests.yml"
  push:
    branches:
      - "feat/offerchin-digikala-catalog-sweep-20261031"
      - "feat/offerchin-parallel-catalog-sweep"
    paths:
      - "affilio_radar/catalog_sweep.py"
      - "affilio_radar/parallel_catalog_sweep.py"
      - "affilio_radar/test_catalog_sweep.py"
      - "affilio_radar/test_parallel_catalog_sweep.py"
      - "affilio_radar/affilio_radar.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 Pillow arabic-reshaper python-bidi CairoSVG
      - name: Compile OfferChin discovery and crawler
        run: |
          python -m py_compile affilio_radar/affilio_radar.py affilio_radar/catalog_sweep.py affilio_radar/parallel_catalog_sweep.py affilio_radar/product_quality.py
      - name: Run catalog crawler regressions
        run: python -m unittest affilio_radar.test_catalog_sweep affilio_radar.test_parallel_catalog_sweep -v
      - name: Run OfferChin selection and DigiPay regressions
        run: |
          python -m unittest \
            affilio_radar.test_affilio.AffilioRadarTests.test_no_current_demand_gate_for_verified_discount \
            affilio_radar.test_affilio.AffilioRadarTests.test_digipay_credit_line_is_added_to_digikala_captions_only -v
