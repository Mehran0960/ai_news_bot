name: OfferChin Catalog Sweep Regression Tests

on:
  pull_request:
    paths:
      - "affilio_radar/catalog_sweep.py"
      - "affilio_radar/parallel_catalog_sweep.py"
      - "affilio_radar/test_catalog_sweep.py"
      - "affilio_radar/test_parallel_catalog_sweep.py"
      - "affilio_radar/affilio_radar.py"
      - "affilio_radar/publisher.py"
      - "affilio_radar/test_affilio.py"
      - ".github/workflows/offerchin-digikala-catalog-sweep.yml"
      - ".github/workflows/offerchin-catalog-sweep-tests.yml"
  push:
    branches:
      - "feat/offerchin-digikala-catalog-sweep-20261031"
      - "feat/offerchin-parallel-catalog-sweep"
    paths:
      - "affilio_radar/catalog_sweep.py"
      - "affilio_radar/parallel_catalog_sweep.py"
      - "affilio_radar/test_catalog_sweep.py"
      - "affilio_radar/test_parallel_catalog_sweep.py"
      - "affilio_radar/affilio_radar.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r affilio_radar/requirements.txt
      - name: Compile OfferChin discovery, ranking and crawler
        run: |
          python -m py_compile affilio_radar/affilio_radar.py affilio_radar/catalog_sweep.py affilio_radar/parallel_catalog_sweep.py affilio_radar/product_quality.py affilio_radar/publisher.py
      - name: Run demand, value and catalog regressions
        env:
          AFFILIO_MIN_DEAL_VALUE_SCORE: "0"
          AFFILIO_REQUIRE_CURRENT_DEMAND: "false"
        run: |
          python -m unittest affilio_radar.test_catalog_sweep affilio_radar.test_parallel_catalog_sweep -v
          cd affilio_radar
          python -m unittest -v test_affilio.py
