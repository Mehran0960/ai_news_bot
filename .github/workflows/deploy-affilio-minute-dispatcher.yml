name: Deploy Affilio Minute Dispatcher

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/affilio-minute-dispatcher.js"
      - "cloudflare/wrangler.toml"
      - ".github/workflows/deploy-affilio-minute-dispatcher.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cloudflare/affilio-minute-dispatcher.js"
      - "cloudflare/wrangler.toml"
      - ".github/workflows/deploy-affilio-minute-dispatcher.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: affilio-minute-dispatcher-production
  cancel-in-progress: false

jobs:
  validate-pr:
    if: ${{ github.event_name == 'pull_request' }}
    name: Validate Worker module and Wrangler config
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the pull request source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare an ES module entrypoint from the canonical Worker source
        run: cp cloudflare/affilio-minute-dispatcher.js cloudflare/affilio-minute-dispatcher.mjs

      - name: Check Worker JavaScript syntax
        run: node --check cloudflare/affilio-minute-dispatcher.mjs

      - name: Dry-run Worker bundle without production credentials
        run: npx --yes wrangler@4 deploy --config cloudflare/wrangler.toml --dry-run

  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    name: Validate and deploy Cloudflare dispatcher
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the exact main-branch source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify Cloudflare credentials are configured
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN. Use an account-owned API token with Workers Editor access scoped to affilio-minute-dispatcher (or account-level Workers Editor); a generic Scripts Write grant may not authorize Wrangler deploy."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare an ES module entrypoint from the canonical Worker source
        run: cp cloudflare/affilio-minute-dispatcher.js cloudflare/affilio-minute-dispatcher.mjs

      - name: Check Worker JavaScript syntax
        run: node --check cloudflare/affilio-minute-dispatcher.mjs

      - name: Validate Worker syntax and Wrangler configuration without deploying
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config cloudflare/wrangler.toml --dry-run

      - name: Deploy the scheduled dispatcher
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config cloudflare/wrangler.toml
