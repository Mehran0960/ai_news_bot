name: Dayan Product Page Inspection

on:
  push:
    paths:
      - ".github/dayan-product-inspect.txt"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r dayan-affiliate-relay/requirements.txt

      - name: Inspect product page without publishing
        env:
          DAYAN_STORE_HOST: ${{ secrets.DAYAN_STORE_HOST }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          product_ref="$(tr -d '[:space:]' < .github/dayan-product-inspect.txt)"
          python dayan-affiliate-relay/relay_botapi.py --inspect-product "$product_ref"
