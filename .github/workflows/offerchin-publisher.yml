name: OfferChin Selected Content Publisher

on:
  # A guarded operational push may resume an interrupted delivery cycle.
  # Routine source commits still cannot publish customer-facing posts.
  # [publisher-run-now] One-time controlled resume after repeat-candidate starvation fix.
  push:
    paths:
      - ".github/workflows/offerchin-publisher.yml"
  # Cloudflare's minute dispatcher starts this workflow every five minutes.
  # [publisher-run-now] One-time resume after channel-publication clock repair.
  # [publisher-run-now] One-time retry after transient image-fetch and stale-selection fixes.
  # [publisher-run-now] One-time verify active-queue cadence repair.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Keep publisher executions ordered, but never queue publication behind discovery
  # or expiry maintenance. Destination delivery state is retried independently.
  group: offerchin-content-publisher
  cancel-in-progress: false

jobs:
  deliver:
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[publisher-run-now]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out current queue and delivery state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: affilio_radar/requirements.txt

      - name: Install dependencies with transient-failure retries
        run: |
          for attempt in 1 2 3; do
            python -m pip install -r affilio_radar/requirements.txt && exit 0
            if [[ "$attempt" -lt 3 ]]; then
              echo "Dependency install attempt $attempt failed; retrying."
              sleep $((attempt * 3))
            fi
          done
          exit 1

      - name: Validate the delivery-only path
        run: |
          python -m py_compile affilio_radar/affilio_radar.py affilio_radar/product_quality.py affilio_radar/content_delivery.py affilio_radar/platform_registry.py affilio_radar/publisher.py affilio_radar/short_video.py affilio_radar/aparat_uploader.py
          python - <<'PY'
          from pathlib import Path
          source = Path("affilio_radar/publisher.py").read_text(encoding="utf-8")
          assert "publish_due_queue()" in source
          assert "discover_product_urls(" not in source
          workflow = Path(".github/workflows/offerchin-publisher.yml").read_text(encoding="utf-8")
          assert "git reset --hard HEAD" in workflow
          print("OFFERCHIN_DELIVERY_ONLY_PATH_VALIDATED")
          print("OFFERCHIN_STATE_PERSISTENCE_WORKTREE_RESET_VALIDATED")
          PY

      # Discovery/selection is a distinct stage. It writes the neutral content queue only.
      # Any later publisher adapter can consume that same selected payload without changing discovery.
      - name: Discover and queue the next verified selection
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AFFILIO_TELEGRAM_CHAT_ID: "@OfferChin"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          APARAT_COOKIE_HEADER: ${{ secrets.APARAT_COOKIE_HEADER }}
          AFFILIO_APARAT_UPLOAD_ENABLED: "false"
          APARAT_SHORTS_ONLY: "false"
          APARAT_VIDEO_PASS: "0"
          AFFILIO_APARAT_UPLOAD_INTERVAL_HOURS: "3"
          APARAT_CATEGORY_ID: ${{ vars.APARAT_CATEGORY_ID || '5' }}
          YOUTUBE_PRIVACY_STATUS: "public"
          AFFILIO_YOUTUBE_UPLOAD_INTERVAL_HOURS: "3"
          AFFILIO_MIN_DISCOUNT_PERCENT: "50"
          AFFILIO_DEAL_LIST_PAGES: "5"
          AFFILIO_MAX_PER_QUERY: "12"
          AFFILIO_SNAPPSHOP_QUERIES_PER_SCAN: "4"
          AFFILIO_MAX_PRODUCT_CHECKS: "90"
          AFFILIO_MAX_INCREDIBLE_OFFER_CANDIDATES: "90"
          AFFILIO_MAX_QUEUED_RECHECKS: "16"
          AFFILIO_PENDING_QUEUE_LIMIT: "200"
          AFFILIO_DISCOVERY_QUEUE_LIMIT: "1000"
          # Only a small rolling set of publication hand-offs/retries may be retained.
          AFFILIO_CONTENT_DELIVERY_QUEUE_LIMIT: "6"
          AFFILIO_DISCOVERY_QUEUE_TTL_HOURS: "24"
          AFFILIO_MAX_DISCOVERY_QUEUE_CHECKS: "64"
          AFFILIO_MCP_PAGES_PER_SCAN: "5"
          AFFILIO_AUTOPUBLISH: "false"
          AFFILIO_MIN_POST_INTERVAL_HOURS: "0.3333333333333333"
          AFFILIO_MIN_PUBLICATION_RUNWAY_MINUTES: "60"
          AFFILIO_COUNTDOWN_SAFETY_BUFFER_MINUTES: "10"
          AFFILIO_MAX_PUBLISH_CANDIDATE_ATTEMPTS: "10"
          PYTHONUNBUFFERED: "1"
        run: python affilio_radar/affilio_radar.py --select-only
      - name: Publish due selections to all registered destinations
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AFFILIO_TELEGRAM_CHAT_ID: "@OfferChin"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          APARAT_COOKIE_HEADER: ${{ secrets.APARAT_COOKIE_HEADER }}
          AFFILIO_APARAT_UPLOAD_ENABLED: "true"
          AFFILIO_APARAT_UPLOAD_INTERVAL_HOURS: "3"
          APARAT_SHORTS_ONLY: "false"
          APARAT_VIDEO_PASS: "0"
          APARAT_CATEGORY_ID: ${{ vars.APARAT_CATEGORY_ID || '5' }}
          YOUTUBE_PRIVACY_STATUS: "public"
          AFFILIO_YOUTUBE_UPLOAD_INTERVAL_HOURS: "3"
          AFFILIO_PUBLISHER_BATCH_SIZE: "1"
          AFFILIO_CONTENT_DELIVERY_QUEUE_LIMIT: "6"
          PYTHONUNBUFFERED: "1"
        run: python affilio_radar/publisher.py

      # Cleanup has its own scheduled workflow and audit ledger; it never
      # occupies this publisher's execution window or competes for state.json.
      - name: Persist independent per-platform results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f affilio_radar/state.json ]] && ! git diff --quiet -- affilio_radar/state.json; then
            git add affilio_radar/state.json
            git commit -m "chore: persist OfferChin delivery results [skip ci]"
            # Keep this state commit, but discard transient artifacts left modified by discovery.
            # Without this reset, rebase aborts on unstaged candidates.json and sent IDs are lost.
            git reset --hard HEAD
            # The independent trust auditor commits a different sidecar file. Retry a transient
            # concurrent push/rebase so a successful public send's message IDs are not lost.
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                echo "PUBLISHER_STATE_PERSISTED attempt=$attempt"
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "Publisher state persistence attempt $attempt failed; retrying."
              sleep $((attempt * 2))
            done
            echo "PUBLISHER_STATE_PERSIST_FAILED; public sends already attempted, next run will reconcile status."
            exit 1
          else
            echo "No delivery-state changes to persist."
          fi
