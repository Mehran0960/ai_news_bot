name: OfferChin Selected Content Publisher
# New posts use exhaustive DigiKala discovery and global market-demand-first ranking; live safety checks remain.
# [publisher-run-now] Verify preserved discount floors after merge.
# [publisher-run-now] Verify final demand and value ranking after regression suite passes.
# [publisher-run-now] One-time quality-gate verification after current-demand and best-selling rollout.
# [publisher-run-now] Controlled live verification after ranked inline fallback rollout.
# [publisher-run-now] One-time live validation after staged discount fallback implementation.
# [publisher-run-now] Validate expanded 90-product discovery and current live handoff.

on:
  # A guarded operational push may resume an interrupted delivery cycle.
  # Routine source commits still cannot publish customer-facing posts.
  # [publisher-run-now] One-time controlled resume after repeat-candidate starvation fix.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/offerchin-publisher.yml"
  # Cloudflare checks every minute and dispatches 27 minutes after the previous channel post.
  # [publisher-run-now] One-time resume after channel-publication clock repair.
  # [publisher-run-now] One-time retry after transient image-fetch and stale-selection fixes.
  # [publisher-run-now] One-time verify active-queue cadence repair.
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  # Keep publisher executions ordered, but never queue publication behind discovery
  # or expiry maintenance. Destination delivery state is retried independently.
  group: offerchin-content-publisher
  cancel-in-progress: false

jobs:
  deliver:
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[publisher-run-now]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out current queue and delivery state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: affilio_radar/requirements.txt

      - name: Install dependencies with transient-failure retries
        run: |
          for attempt in 1 2 3; do
            python -m pip install -r affilio_radar/requirements.txt && exit 0
            if [[ "$attempt" -lt 3 ]]; then
              echo "Dependency install attempt $attempt failed; retrying."
              sleep $((attempt * 3))
            fi
          done
          exit 1

      - name: Fetch official DigiPay logo
        continue-on-error: true
        run: |
          mkdir -p affilio_radar/assets/retailer-logos
          curl --fail --silent --show-error --retry 2 --connect-timeout 8 --max-time 30 \
            "https://www.mydigipay.com/bck-assets/images/logos/dp-logo.svg" \
            -o affilio_radar/assets/retailer-logos/digipay-official.svg
          test -s affilio_radar/assets/retailer-logos/digipay-official.svg
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          source = Path("affilio_radar/assets/retailer-logos/digipay-official.svg").read_bytes()
          png = cairosvg.svg2png(bytestring=source, output_width=320)
          assert png[:8] == bytes([137, 80, 78, 71, 13, 10, 26, 10])
          print("DIGIPAY_OFFICIAL_LOGO_STAGED_AND_VALIDATED")
          PY
          PYTHONPATH=affilio_radar python - <<'PY'
          import offerchin_visuals
          assert offerchin_visuals._load_digipay_logo() is not None
          print("DIGIPAY_RENDERER_CAN_LOAD_OFFICIAL_LOGO")
          PY

      - name: Validate the delivery-only path
        run: |
          python -m py_compile affilio_radar/affilio_radar.py affilio_radar/expiration_monitor.py affilio_radar/offerchin_visuals.py affilio_radar/product_quality.py affilio_radar/content_delivery.py affilio_radar/platform_registry.py affilio_radar/publisher.py affilio_radar/messenger_adapters.py affilio_radar/short_video.py affilio_radar/aparat_uploader.py
          python - <<'PY'
          from pathlib import Path
          source = Path("affilio_radar/publisher.py").read_text(encoding="utf-8")
          assert "publish_due_queue()" in source
          assert "discover_product_urls(" not in source
          workflow = Path(".github/workflows/offerchin-publisher.yml").read_text(encoding="utf-8")
          assert "git reset --hard HEAD" in workflow
          print("OFFERCHIN_DELIVERY_ONLY_PATH_VALIDATED")
          print("OFFERCHIN_STATE_PERSISTENCE_WORKTREE_RESET_VALIDATED")
          PY

      - name: Validate DigiKala demand-first ranking and publication gates
        run: |
          cd affilio_radar
          python -m unittest \
            test_affilio.AffilioRadarTests.test_three_recent_reviews_in_active_window_qualify_current_demand \
            test_affilio.AffilioRadarTests.test_digikala_caption_mentions_conditional_digipay_credit \
            test_affilio.AffilioRadarTests.test_discount_publishing_requires_a_valuable_deal \
            test_affilio.AffilioRadarTests.test_selection_uses_market_demand_before_discount_and_savings \
            test_affilio.AffilioRadarTests.test_discovery_check_budget_applies_24h_family_guard_before_budget \
            test_affilio.AffilioRadarTests.test_publish_ranking_uses_market_demand_before_discount \
            test_affilio.AffilioRadarTests.test_urgent_selection_uses_market_demand_before_discount \
            test_affilio.AffilioRadarTests.test_price_history_checks_are_throttled_and_snapshots_remain_available \
            test_affilio.AffilioRadarTests.test_market_price_enrichment_rotates_after_torob_challenge \
            test_affilio.AffilioRadarTests.test_all_real_discount_bands_compete_without_a_percentage_or_saving_floor \
            test_affilio.AffilioRadarTests.test_last_mile_photo_sender_accepts_a_49_percent_offer_with_real_markdown \
            test_affilio.AffilioRadarTests.test_preferred_posting_windows_use_iran_local_time \
            test_affilio.AffilioRadarTests.test_publication_interval_is_27_minutes \
            test_affilio.AffilioRadarTests.test_video_upload_candidate_limit_covers_dispatch_sidecar \
            test_affilio.AffilioRadarTests.test_fresh_bestseller_rank_changes_demand_ranking_but_clicks_do_not \
            test_affilio.AffilioRadarTests.test_scoring_does_not_generate_popularity_or_demand_scores \
            test_affilio.AffilioRadarTests.test_lifetime_reviews_and_rating_are_weak_demand_context_when_direct_signals_are_absent \
            test_affilio.AffilioRadarTests.test_demand_context_precedes_discount_but_clicks_and_synthetic_scores_are_ignored \
            test_affilio.AffilioRadarTests.test_creative_assignment_is_stable_and_balanced_over_product_ids \
            test_affilio.AffilioRadarTests.test_caption_experiment_assignment_is_stable_balanced_and_independent \
            test_affilio.AffilioRadarTests.test_performance_report_never_infers_ctr_sales_or_commission_from_clicks \
            test_affilio.AffilioRadarTests.test_visual_and_caption_experiments_are_independent \
            test_affilio.AffilioRadarTests.test_click_tracker_wraps_only_same_product_affiliate_destinations \
            test_affilio.AffilioRadarTests.test_click_tracker_preserves_supported_affilio_template_and_adds_experiment_labels \
            test_affilio.AffilioRadarTests.test_click_tracker_supports_channel_attribution_and_rejects_unknown_source_names \
            test_affilio.AffilioRadarTests.test_superseded_youtube_short_is_retained_after_replacement_upload \
            test_affilio.AffilioRadarTests.test_replaced_youtube_video_is_retained_after_new_upload_is_confirmed \
            test_short_video.ShortVideoTests.test_youtube_video_removal_is_refused_without_network_access \
            test_affilio.AffilioRadarTests.test_youtube_upload_allows_published_product_without_official_expiry_timer \
            test_affilio.AffilioRadarTests.test_public_aparat_upload_stays_blocked_without_verified_expiry \
            test_affilio.AffilioRadarTests.test_aparat_expiry_gate_uses_the_selected_video_not_the_last_scanned_record -v
          python -m unittest test_selection_evidence -v
          python -m unittest -v test_content_delivery.py
          python -m unittest -v test_shared_selection_media_routing.py
          node --test test_affiliate_deal_radar_worker.mjs

      - name: Validate permanent YouTube retention policy
        run: |
          cd affilio_radar
          python -m unittest \
            test_expiration_monitor.ExpirationMonitorTests.test_expired_youtube_short_is_retained_without_delete_or_privacy_change \
            test_expiration_monitor.ExpirationMonitorTests.test_youtube_retention_does_not_require_expiry_or_oauth_credentials -v

      # Discovery/selection is a distinct stage. It writes the neutral content queue only.
      # Independent video workflows consume the persisted published-product records after channel delivery.
      - name: Discover and queue the next verified selection
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AFFILIO_TELEGRAM_CHAT_ID: "@OfferChin"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          AFFILIO_APARAT_UPLOAD_ENABLED: "false"
          APARAT_SHORTS_ONLY: "false"
          APARAT_VIDEO_PASS: "0"
          APARAT_CATEGORY_ID: ${{ vars.APARAT_CATEGORY_ID || '5' }}
          AFFILIO_MIN_DISCOUNT_PERCENT: "1"
          AFFILIO_HISTORY_CHECK_LIMIT: "2"
          AFFILIO_HISTORY_RECHECK_HOURS: "24"
          AFFILIO_MARKET_CHECK_LIMIT: "2"
          AFFILIO_MARKET_RECHECK_HOURS: "24"
          AFFILIO_MARKET_CHALLENGE_COOLDOWN_HOURS: "6"
          AFFILIO_MARKET_GLOBAL_PAUSE_MINUTES: "20"
          # Native DigiKala bestseller rank is primary; fresh review growth is a weaker
          # demand proxy before historical review context and markdown value. It is not unit-sales data.
          AFFILIO_CURRENT_DEMAND_WINDOW_DAYS: "1"
          AFFILIO_CURRENT_DEMAND_MIN_REVIEW_GROWTH: "3"
          AFFILIO_CURRENT_DEMAND_MIN_OBSERVATION_HOURS: "6"
          AFFILIO_CURRENT_DEMAND_SAMPLE_INTERVAL_HOURS: "2"
          AFFILIO_CURRENT_DEMAND_MAX_SIGNAL_AGE_HOURS: "12"
          AFFILIO_DEAL_LIST_PAGES: "5"
          AFFILIO_MAX_PER_QUERY: "12"
          AFFILIO_SNAPPSHOP_QUERIES_PER_SCAN: "4"
          AFFILIO_MAX_PRODUCT_CHECKS: "250"
          AFFILIO_MAX_INCREDIBLE_OFFER_CANDIDATES: "250"
          AFFILIO_MAX_QUEUED_RECHECKS: "16"
          AFFILIO_PENDING_QUEUE_LIMIT: "200"
          AFFILIO_DISCOVERY_QUEUE_LIMIT: "5000"
          # Only a small rolling set of publication hand-offs/retries may be retained.
          AFFILIO_CONTENT_DELIVERY_QUEUE_LIMIT: "250"
          AFFILIO_CATALOG_SWEEP_HANDOFF_PER_RUN: "250"
          AFFILIO_MAX_DAILY_CHANNEL_POSTS: "72"
          OFFERCHIN_EMERGENCY_CONTINUITY_ENABLED: "true"
          AFFILIO_DISCOVERY_QUEUE_TTL_HOURS: "24"
          AFFILIO_MAX_DISCOVERY_QUEUE_CHECKS: "250"
          AFFILIO_MCP_PAGES_PER_SCAN: "5"
          AFFILIO_AUTOPUBLISH: "false"
          AFFILIO_MIN_POST_INTERVAL_HOURS: "0.45"
          AFFILIO_MIN_PUBLICATION_RUNWAY_MINUTES: "0"
          AFFILIO_COUNTDOWN_SAFETY_BUFFER_MINUTES: "10"
          AFFILIO_MAX_PUBLISH_CANDIDATE_ATTEMPTS: "250"
          PYTHONUNBUFFERED: "1"
        run: python affilio_radar/affilio_radar.py --select-only
      - name: Publish due selections to Telegram and Bale only
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AFFILIO_TELEGRAM_CHAT_ID: "@OfferChin"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_CHANNEL_ID: ${{ secrets.RUBIKA_CHAT_ID || vars.RUBIKA_CHAT_ID || secrets.RUBIKA_CHANNEL_ID || vars.RUBIKA_CHANNEL_ID || 'c0EH9WW0c7fa831d965d050233b7ab35' }}
          RUBIKA_ENABLE_PUBLISHING: ${{ vars.RUBIKA_ENABLE_PUBLISHING || 'true' }}
          EITAA_BOT_TOKEN: ${{ secrets.EITAA_BOT_TOKEN }}
          EITAA_CHANNEL_ID: ${{ secrets.EITAA_CHANNEL_ID }}
          EITAA_CHANNEL_URL: ${{ vars.EITAA_CHANNEL_URL || '' }}
          EITAA_ENABLE_PUBLISHING: ${{ vars.EITAA_ENABLE_PUBLISHING || 'false' }}
          # Video publication is deliberately excluded from the channel worker.
          AFFILIO_APARAT_UPLOAD_ENABLED: "false"
          APARAT_SHORTS_ONLY: "false"
          APARAT_VIDEO_PASS: "0"
          APARAT_CATEGORY_ID: ${{ vars.APARAT_CATEGORY_ID || '5' }}
          AFFILIO_PUBLISHER_BATCH_SIZE: "1"
          AFFILIO_CONTENT_DELIVERY_QUEUE_LIMIT: "250"
          AFFILIO_MIN_PUBLICATION_RUNWAY_MINUTES: "0"
          AFFILIO_MIN_POST_INTERVAL_HOURS: "0.45"
          AFFILIO_MAX_DAILY_CHANNEL_POSTS: "72"
          OFFERCHIN_EDITORIAL_PUBLISH_ENABLED: "true"
          PYTHONUNBUFFERED: "1"
        run: python affilio_radar/publisher.py

      - name: Publish the same-sequence editorial fallback to photo channels
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AFFILIO_TELEGRAM_CHAT_ID: "@OfferChin"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_CHANNEL_ID: ${{ secrets.RUBIKA_CHAT_ID || vars.RUBIKA_CHAT_ID || secrets.RUBIKA_CHANNEL_ID || vars.RUBIKA_CHANNEL_ID || 'c0EH9WW0c7fa831d965d050233b7ab35' }}
          RUBIKA_ENABLE_PUBLISHING: ${{ vars.RUBIKA_ENABLE_PUBLISHING || 'true' }}
          EITAA_BOT_TOKEN: ${{ secrets.EITAA_BOT_TOKEN }}
          EITAA_CHANNEL_ID: ${{ secrets.EITAA_CHANNEL_ID }}
          EITAA_ENABLE_PUBLISHING: ${{ vars.EITAA_ENABLE_PUBLISHING || 'false' }}
          OFFERCHIN_EDITORIAL_GAP_MINUTES: "55"
          OFFERCHIN_EDITORIAL_PUBLISH_ENABLED: "true"
          PYTHONUNBUFFERED: "1"
        run: |
          if [[ "${OFFERCHIN_EDITORIAL_PUBLISH_ENABLED,,}" == "true" ]]; then
            echo "EDITORIAL_PUBLISH_FEATURE_ENABLED"
            python affilio_radar/editorial_publisher.py --channels-only --publish
          else
            echo "EDITORIAL_SHADOW_ONLY_PUBLIC_PUBLISH_DISABLED"
            python affilio_radar/editorial_publisher.py --channels-only
          fi

      # Cleanup has its own scheduled workflow and audit ledger; it never
      # occupies this publisher's execution window or competes for state.json.
      - name: Persist independent per-platform results
        id: persist_delivery_state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f affilio_radar/state.json ]] && { ! git diff --quiet -- affilio_radar/state.json || ! git diff --quiet -- affilio_radar/diversity_report.json || ! git diff --quiet -- affilio_radar/performance_report.json; }; then
            git add affilio_radar/state.json
            if [[ -f affilio_radar/video_upload_dispatch_state.json ]]; then
              git add affilio_radar/video_upload_dispatch_state.json
            fi
            if [[ -f affilio_radar/diversity_report.json ]]; then
              git add affilio_radar/diversity_report.json
            fi
            if [[ -f affilio_radar/performance_report.json ]]; then
              git add affilio_radar/performance_report.json
            fi
            git commit -m "chore: persist OfferChin delivery and performance reports [skip ci]"
            # Keep this state commit, but discard transient artifacts left modified by discovery.
            # Without this reset, rebase aborts on unstaged candidates.json and sent IDs are lost.
            git reset --hard HEAD
            # The independent trust auditor commits a different sidecar file. Retry a transient
            # concurrent push/rebase so a successful public send's message IDs are not lost.
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                echo "PUBLISHER_STATE_PERSISTED attempt=$attempt"
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "Publisher state persistence attempt $attempt failed; retrying."
              sleep $((attempt * 2))
            done
            echo "PUBLISHER_STATE_PERSIST_FAILED; public sends already attempted, next run will reconcile status."
            exit 1
          else
            echo "No delivery-state changes to persist."
          fi
      - name: Dispatch unified video fan-out for the canonical product queue
        if: ${{ always() && steps.persist_delivery_state.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/offerchin-video-publisher.yml/dispatches" \
            -f ref=main
          echo "OFFERCHIN_VIDEO_FANOUT_DISPATCHED source=selected_content_publisher"
