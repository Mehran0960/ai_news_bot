name: OfferChin Selected Content Publisher

on:
  # A one-time guarded push trigger lets us validate the delivery path without
  # making routine source commits publish customer-facing posts.
  push:
    paths:
      - ".github/workflows/offerchin-publisher.yml"
  schedule:
    # GitHub scheduled workflows support five-minute cadence. The publisher is
    # independent from discovery and processes only items whose scheduled_at is due.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize all mutations of public channels and the shared state ledger.
  group: affilio-channel-updates
  cancel-in-progress: false

jobs:
  deliver:
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[publisher-run-now]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out current queue and delivery state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: affilio_radar/requirements.txt

      - name: Install dependencies with transient-failure retries
        run: |
          for attempt in 1 2 3; do
            python -m pip install -r affilio_radar/requirements.txt && exit 0
            if [[ "$attempt" -lt 3 ]]; then
              echo "Dependency install attempt $attempt failed; retrying."
              sleep $((attempt * 3))
            fi
          done
          exit 1

      - name: Validate the delivery-only path
        run: |
          python -m py_compile affilio_radar/affilio_radar.py affilio_radar/content_delivery.py affilio_radar/platform_registry.py affilio_radar/publisher.py affilio_radar/short_video.py affilio_radar/aparat_uploader.py
          python - <<'PY'
          from pathlib import Path
          source = Path("affilio_radar/publisher.py").read_text(encoding="utf-8")
          assert "publish_due_queue()" in source
          assert "discover_product_urls(" not in source
          print("OFFERCHIN_DELIVERY_ONLY_PATH_VALIDATED")
          PY

      # Routine cleanup is intentionally sequenced before delivery in the same run.
      # This prevents cleanup and publishing workflows from fighting over the same channel lock.
      # A slow or failed audit is bounded and must never suppress the delivery attempt.
      - name: Audit existing posts and remove verified stale offers
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AFFILIO_TELEGRAM_CHAT_ID: "@OfferChin"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          APARAT_COOKIE_HEADER: ${{ secrets.APARAT_COOKIE_HEADER }}
          AFFILIO_DEAL_LIST_PAGES: "5"
          AFFILIO_PUBLIC_HISTORY_PAGES: "1"
          AFFILIO_PRICE_AUDIT_BATCH_SIZE: "10"
          AFFILIO_PRICE_AUDIT_INTERVAL_SECONDS: "3600"
          AFFILIO_PRICE_AUDIT_RETRY_SECONDS: "900"
          AFFILIO_DIRECT_PRODUCT_DETAIL_CHECK_LIMIT: "4"
          AFFILIO_COUNTDOWN_SAFETY_BUFFER_MINUTES: "10"
          PYTHONUNBUFFERED: "1"
        run: timeout --signal=TERM 330s python affilio_radar/expiration_monitor.py || echo "PRICE_AUDIT_OR_CLEANUP_INCOMPLETE; delivery continues and next cycle retries"
      - name: Publish due selections to all registered destinations
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AFFILIO_TELEGRAM_CHAT_ID: "@OfferChin"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          APARAT_COOKIE_HEADER: ${{ secrets.APARAT_COOKIE_HEADER }}
          AFFILIO_APARAT_UPLOAD_ENABLED: "true"
          AFFILIO_APARAT_UPLOAD_INTERVAL_HOURS: "3"
          APARAT_SHORTS_ONLY: "false"
          APARAT_VIDEO_PASS: "0"
          APARAT_CATEGORY_ID: ${{ vars.APARAT_CATEGORY_ID || '5' }}
          YOUTUBE_PRIVACY_STATUS: "public"
          AFFILIO_YOUTUBE_UPLOAD_INTERVAL_HOURS: "3"
          AFFILIO_PUBLISHER_BATCH_SIZE: "1"
          PYTHONUNBUFFERED: "1"
        run: python affilio_radar/publisher.py

      - name: Persist independent per-platform results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f affilio_radar/state.json ]] && ! git diff --quiet -- affilio_radar/state.json; then
            git add affilio_radar/state.json
            git commit -m "chore: persist OfferChin delivery results [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No delivery-state changes to persist."
          fi
