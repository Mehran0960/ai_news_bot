name: OfferChin Recent Caption Repair

on:
  push:
    paths:
      - ".github/offerchin-caption-repair-request.json"

permissions:
  contents: write

# Serialize the state-file edit with OfferChin publishing; this lane never publishes products.
concurrency:
  group: offerchin-content-publisher
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the current OfferChin state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: affilio_radar/requirements.txt

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            python -m pip install -r affilio_radar/requirements.txt && exit 0
            if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 3)); fi
          done
          exit 1

      - name: Fetch and validate the official DigiPay logo
        run: |
          mkdir -p affilio_radar/assets/retailer-logos
          curl --fail --silent --show-error --retry 2 --connect-timeout 8 --max-time 30 \
            "https://www.mydigipay.com/bck-assets/images/logos/dp-logo.svg" \
            -o affilio_radar/assets/retailer-logos/digipay-official.svg
          test -s affilio_radar/assets/retailer-logos/digipay-official.svg
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          source = Path("affilio_radar/assets/retailer-logos/digipay-official.svg").read_bytes()
          png = cairosvg.svg2png(bytestring=source, output_width=320)
          assert png[:8] == bytes([137, 80, 78, 71, 13, 10, 26, 10])
          print("DIGIPAY_OFFICIAL_LOGO_STAGED_AND_VALIDATED")
          PY
          PYTHONPATH=affilio_radar python - <<'PY'
          import offerchin_visuals
          assert offerchin_visuals._load_digipay_logo() is not None
          print("DIGIPAY_RENDERER_CAN_LOAD_OFFICIAL_LOGO")
          PY

      - name: Validate the one-shot request and repair implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          request = json.loads(Path(".github/offerchin-caption-repair-request.json").read_text(encoding="utf-8"))
          assert request.get("action") == "repair_recent_digipay_posts"
          assert float(request.get("lookback_hours", 0)) > 0
          assert float(request.get("lookback_hours", 48)) <= 47
          source = Path("affilio_radar/affilio_radar.py").read_text(encoding="utf-8")
          assert 'installment_line = bold("💳 خرید اقساطی با دیجی‌پی (در صورت نمایش گزینه و احراز شرایط)")' in source
          assert "--repair-recent-digipay-posts" in source
          assert "def _recent_digipay_repair_records" in source
          visuals = Path("affilio_radar/offerchin_visuals.py").read_text(encoding="utf-8")
          assert "def _digipay_brand_blue" in visuals
          print("OFFERCHIN_RECENT_CAPTION_REPAIR_REQUEST_VALIDATED")
          PY
          python -m py_compile affilio_radar/affilio_radar.py

      - name: Run caption and recent-selection regression tests
        run: |
          cd affilio_radar
          python -m unittest             test_affilio.AffilioRadarTests.test_digikala_caption_mentions_conditional_digipay_credit             test_affilio.AffilioRadarTests.test_snappshop_caption_uses_correct_store_name             test_affilio.AffilioRadarTests.test_recent_caption_repair_selects_only_newest_active_products             test_affilio.AffilioRadarTests.test_recent_digipay_selector_includes_all_recent_active_retailer_posts             test_affilio.AffilioRadarTests.test_digipay_blue_background_matches_retailer_tile_and_centers_untouched_icon             test_affilio.AffilioRadarTests.test_edit_telegram_media_replaces_photo_and_preserves_verified_buy_button             test_affilio.AffilioRadarTests.test_delete_bale_message_uses_documented_delete_method -v

      - name: Repair all recent active DigiPay product posts in place
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AFFILIO_TELEGRAM_CHAT_ID: "@OfferChin"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          lookback_hours="$(python -c 'import json; print(json.load(open(".github/offerchin-caption-repair-request.json", encoding="utf-8"))["lookback_hours"])')"
          python affilio_radar/affilio_radar.py --repair-recent-digipay-posts --lookback-hours "$lookback_hours"

      - name: Persist the edited-post state and repair report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add affilio_radar/state.json affilio_radar/affiliate_link_repair_report.json
          if [[ -f affilio_radar/product_image_repair_report.json ]]; then
            git add affilio_radar/product_image_repair_report.json
          fi
          if git diff --cached --quiet; then
            echo "No state/report changes to persist."
            exit 0
          fi
          git commit -m "chore: persist OfferChin recent caption repair [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "OFFERCHIN_RECENT_CAPTION_REPAIR_STATE_PERSISTED attempt=$attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "OFFERCHIN_RECENT_CAPTION_REPAIR_STATE_PERSIST_FAILED"
          exit 1
