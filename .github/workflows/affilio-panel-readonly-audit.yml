name: Affilio Publisher Panel Read-Only Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - "affilio_radar/affilio_panel_audit.py"
      - "affilio_radar/test_affilio_panel_audit.py"
      - ".github/workflows/affilio-panel-readonly-audit.yml"
  push:
    branches:
      - main
    paths:
      - "affilio_radar/affilio_panel_audit.py"
      - "affilio_radar/test_affilio_panel_audit.py"
      - ".github/workflows/affilio-panel-readonly-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: affilio-panel-readonly-audit
  cancel-in-progress: false

jobs:
  readonly-panel-audit:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run parser and URL safety tests
        run: python -m unittest -v affilio_radar.test_affilio_panel_audit

      - name: Authenticate to Affilio and inspect report navigation (read-only)
        env:
          AFFILIO_USER: ${{ secrets.AFFILIO_USER }}
          AFFILIO_PASS: ${{ secrets.AFFILIO_PASS }}
        run: python affilio_radar/affilio_panel_audit.py

      - name: State security boundaries
        if: always()
        run: |
          echo "No panel report rows are printed or uploaded."
          echo "No browser cookies, SSO tokens, or credentials are persisted."
          echo "Only authentication status and sanitized same-origin route paths are logged."
