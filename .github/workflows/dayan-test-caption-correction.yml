name: Dayan Test Caption Correction

on:
  push:
    paths:
      - ".github/dayan-caption-edit.txt"

permissions:
  contents: read

jobs:
  edit-caption:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r dayan-affiliate-relay/requirements.txt

      - name: Correct test caption without reposting media
        env:
          TELEGRAM_BOT_TOKEN: \${{ secrets.TELEGRAM_BOT_TOKEN }}
          DAYAN_STORE_HOST: \${{ secrets.DAYAN_STORE_HOST }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          pair="$(tr -d '[:space:]' < .github/dayan-caption-edit.txt)"
          IFS=: read -r source_id destination_id <<< "$pair"
          [[ "$source_id" =~ ^[0-9]{1,8}$ ]]
          [[ "$destination_id" =~ ^[0-9]{1,8}$ ]]
          python dayan-affiliate-relay/relay_botapi.py --edit-caption "$source_id" "$destination_id"
