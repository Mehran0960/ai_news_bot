name: OfferChin Aparat Video Upload

on:
  # The Cloudflare minute dispatcher starts this worker when Aparat's own saved slot is due.
  # Manual dispatch remains available for controlled recovery.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # YouTube, Aparat and channel jobs all update state.json; serialize only these writers.
  group: offerchin-content-publisher
  cancel-in-progress: false

jobs:
  upload-aparat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current repository state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: affilio_radar/requirements.txt

      - name: Install dependencies with retries
        run: |
          for attempt in 1 2 3; do
            python -m pip install -r affilio_radar/requirements.txt && exit 0
            if [[ "$attempt" -lt 3 ]]; then
              echo "Dependency install attempt $attempt failed; retrying."
              sleep $((attempt * 3))
            fi
          done
          exit 1

      - name: Stage official DigiPay logo for video cards
        continue-on-error: true
        run: |
          mkdir -p affilio_radar/assets/retailer-logos
          curl --fail --silent --show-error --retry 2 --connect-timeout 8 --max-time 30 \
            "https://www.mydigipay.com/bck-assets/images/logos/dp-logo.svg" \
            -o affilio_radar/assets/retailer-logos/digipay-official.svg
          test -s affilio_radar/assets/retailer-logos/digipay-official.svg
          PYTHONPATH=affilio_radar python - <<'PY'
          import offerchin_visuals
          logo = offerchin_visuals._load_digipay_logo()
          assert logo is not None and logo.width > 0 and logo.height > 0
          print("DIGIPAY_OFFICIAL_LOGO_READY_FOR_VIDEO_RENDER")
          PY

      - name: Validate the isolated upload path
        run: |
          python -m py_compile affilio_radar/affilio_radar.py affilio_radar/aparat_uploader.py affilio_radar/short_video.py
          python - <<'PY'
          import os
          os.environ["AFFILIO_APARAT_UPLOAD_ENABLED"] = "true"
          from pathlib import Path
          source = Path("affilio_radar/affilio_radar.py").read_text(encoding="utf-8")
          assert "--aparat-upload-only" in source
          assert 'destinations={"aparat"}' in source
          print("APARAT_ONLY_PATH_VALIDATED")
          PY

      - name: Process only the Aparat video queue
        env:
          APARAT_COOKIE_HEADER: ${{ secrets.APARAT_COOKIE_HEADER }}
          AFFILIO_APARAT_UPLOAD_ENABLED: "true"
          AFFILIO_APARAT_UPLOAD_INTERVAL_HOURS: "3"
          AFFILIO_VIDEO_UPLOAD_CANDIDATE_LIMIT: "6"
          AFFILIO_VIDEO_UPLOAD_MAX_AGE_HOURS: "24"
          APARAT_SHORTS_ONLY: "false"
          APARAT_VIDEO_PASS: "0"
          APARAT_CATEGORY_ID: ${{ vars.APARAT_CATEGORY_ID || '5' }}
          # Explicitly keep YouTube out of this workflow, even if its credentials exist.
          YOUTUBE_CLIENT_ID: ""
          YOUTUBE_CLIENT_SECRET: ""
          YOUTUBE_REFRESH_TOKEN: ""
          AFFILIO_MAX_SHORT_VIDEOS_PER_RUN: "2"
          PYTHONUNBUFFERED: "1"
        run: python affilio_radar/affilio_radar.py --aparat-upload-only

      - name: Preserve any generated MP4 for short-term diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offerchin-aparat-video-${{ github.run_id }}
          path: video_artifacts/*.mp4
          if-no-files-found: ignore
          retention-days: 3

      - name: Persist Aparat upload statuses and next slot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f affilio_radar/state.json ]] && ! git diff --quiet -- affilio_radar/state.json; then
            git add affilio_radar/state.json
            git commit -m "chore: persist Aparat upload queue state [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No Aparat state changes to persist."
          fi
