name: OfferChin Aparat Video Upload

on:
  workflow_dispatch:
  schedule:
    # Check the persisted Aparat-only queue every 15 minutes; actual uploads remain
    # spaced by AFFILIO_APARAT_UPLOAD_INTERVAL_HOURS (default 3 hours).
    - cron: "3,18,33,48 * * * *"

permissions:
  contents: write

concurrency:
  # Shares the live-state lock with the main radar so independent workflows cannot
  # overwrite each other's state.json changes.
  group: affilio-channel-updates
  cancel-in-progress: false

jobs:
  upload-aparat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current repository state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: affilio_radar/requirements.txt

      - name: Install dependencies with retries
        run: |
          for attempt in 1 2 3; do
            python -m pip install -r affilio_radar/requirements.txt && exit 0
            if [[ "$attempt" -lt 3 ]]; then
              echo "Dependency install attempt $attempt failed; retrying."
              sleep $((attempt * 3))
            fi
          done
          exit 1

      - name: Validate the isolated upload path
        run: |
          python -m py_compile affilio_radar/affilio_radar.py affilio_radar/aparat_uploader.py affilio_radar/short_video.py
          python - <<'PY'
          import os
          os.environ["AFFILIO_APARAT_UPLOAD_ENABLED"] = "true"
          from pathlib import Path
          source = Path("affilio_radar/affilio_radar.py").read_text(encoding="utf-8")
          assert "--aparat-upload-only" in source
          assert 'destinations={"aparat"}' in source
          print("APARAT_ONLY_PATH_VALIDATED")
          PY

      - name: Process only the Aparat video queue
        env:
          APARAT_COOKIE_HEADER: ${{ secrets.APARAT_COOKIE_HEADER }}
          AFFILIO_APARAT_UPLOAD_ENABLED: "true"
          AFFILIO_APARAT_UPLOAD_INTERVAL_HOURS: "3"
          APARAT_SHORTS_ONLY: "false"
          APARAT_VIDEO_PASS: "0"
          APARAT_CATEGORY_ID: ${{ vars.APARAT_CATEGORY_ID || '5' }}
          # Explicitly keep YouTube out of this workflow, even if its credentials exist.
          YOUTUBE_CLIENT_ID: ""
          YOUTUBE_CLIENT_SECRET: ""
          YOUTUBE_REFRESH_TOKEN: ""
          AFFILIO_MAX_SHORT_VIDEOS_PER_RUN: "2"
          PYTHONUNBUFFERED: "1"
        run: python affilio_radar/affilio_radar.py --aparat-upload-only

      - name: Preserve any generated MP4 for short-term diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offerchin-aparat-video-${{ github.run_id }}
          path: video_artifacts/*.mp4
          if-no-files-found: ignore
          retention-days: 3

      - name: Persist Aparat upload statuses and next slot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f affilio_radar/state.json ]] && ! git diff --quiet -- affilio_radar/state.json; then
            git add affilio_radar/state.json
            git commit -m "chore: persist Aparat upload queue state [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No Aparat state changes to persist."
          fi
