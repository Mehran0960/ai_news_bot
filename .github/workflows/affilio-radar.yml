name: Affilio Product Radar

on:
  push:
    paths:
      - "affilio_radar/affilio_radar.py"
      - "affilio_radar/test_affilio.py"
      - "affilio_radar/requirements.txt"
      - "affilio_radar/config/products.json"
      - "affilio_radar/README.md"
      - ".github/workflows/affilio-radar.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish image deals to @Iran_gajet"
        required: true
        type: boolean
        default: false
      batch_count:
        description: "Number of posts for a manual run (1–10)"
        required: true
        type: number
        default: 1
      clear_previous_posts:
        description: "Try deleting older public-channel posts before publishing"
        required: true
        type: boolean
        default: false
  schedule:
    # Main cadence: one publication is permitted after the 30-minute cooldown.
    - cron: "*/30 * * * *"
    # Staggered retries reduce the chance that a delayed/missed scheduled event leaves the channel idle.
    # The app's state-based cooldown prevents these backup checks from causing duplicate posts.
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: affilio-product-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Log automation trigger
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "scheduled_publish=${{ github.event_name == 'schedule' }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Persian font for the discount badge
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-core

      - name: Install Python dependencies
        run: python -m pip install -r affilio_radar/requirements.txt

      - name: Validate syntax and run unit tests
        run: |
          python -m py_compile affilio_radar/affilio_radar.py
          cd affilio_radar
          python -m unittest -v test_affilio.py

      - name: Smoke-test the deployed click tracker
        run: |
          python - <<'PY'
          import os
          import requests

          base = os.getenv(
              "AFFILIO_CLICK_TRACKER_BASE_URL",
              "https://affiliate-deal-radar.m-hoseyni-6966.workers.dev",
          ).rstrip("/")
          headers = {"User-Agent": "Bot"}
          health = requests.get(f"{base}/health", timeout=20, headers=headers)
          health.raise_for_status()
          status = health.json()
          assert status.get("ok") is True, status
          assert status.get("clickStoreReady") is True, status
          print("CLICK_TRACKER_HEALTH_OK")

          product_id = "dkp-15970075"
          bad = requests.get(
              f"{base}/p/{product_id}",
              params={"u": "https://example.com/"},
              headers=headers,
              allow_redirects=False,
              timeout=20,
          )
          assert bad.status_code == 400, (bad.status_code, bad.text[:200])
          print("CLICK_TRACKER_REJECTS_UNTRUSTED_DESTINATION")

          destination = (
              f"https://www.digikala.com/product/{product_id}/"
              "?utm_source=19166&utm_medium=Affilio&utm_id=14657"
              "&affid=OTgxYTY0OTAtODJhNS00MDNkLTg0NDItMWE0MGVkOGI1Yjhj"
          )
          good = requests.get(
              f"{base}/p/{product_id}",
              params={"u": destination},
              headers=headers,
              allow_redirects=False,
              timeout=20,
          )
          assert good.status_code == 302, (good.status_code, good.text[:200])
          assert good.headers.get("Location", "").startswith(
              f"https://www.digikala.com/product/{product_id}/"
          ), good.headers.get("Location")
          print("CLICK_TRACKER_VALID_REDIRECT_OK")

          stats = requests.get(f"{base}/stats", timeout=20, headers=headers)
          stats.raise_for_status()
          analytics = stats.json()
          assert analytics.get("ok") is True, analytics
          assert isinstance(analytics.get("products"), dict), analytics
          assert isinstance(analytics.get("totalClicks"), int), analytics
          print("CLICK_TRACKER_AGGREGATED_STATS_OK")
          PY

      - name: Discover products, verify stock, compare current market prices, and publish one image if enabled
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AFFILIO_LINK_TEMPLATE: ${{ secrets.AFFILIO_LINK_TEMPLATE }}
          AFFILIO_TELEGRAM_CHAT_ID: "@Iran_gajet"
          AFFILIO_AUTOPUBLISH: ${{ github.event_name == 'schedule' || inputs.publish || contains(github.event.head_commit.message, '[publish-now]') }}
          AFFILIO_MIN_POST_INTERVAL_HOURS: "0.5"
          AFFILIO_MAX_POSTS_PER_RUN: ${{ contains(github.event.head_commit.message, '[publish-now]') && '10' || inputs.batch_count || '1' }}
          AFFILIO_CLEAR_PREVIOUS_CHANNEL_POSTS: ${{ contains(github.event.head_commit.message, '[publish-now]') || inputs.clear_previous_posts }}
          AFFILIO_BATCH_KEY: ${{ contains(github.event.head_commit.message, '[publish-now]') && github.sha || github.run_id }}
          AFFILIO_FORCE_POST_COOLDOWN_BYPASS: ${{ contains(github.event.head_commit.message, '[publish-now]') || (inputs.publish && inputs.clear_previous_posts) }}
          PYTHONUNBUFFERED: "1"
        run: python affilio_radar/affilio_radar.py

      - name: Commit candidate report and state only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add affilio_radar/candidates.json
          if [[ -f affilio_radar/state.json ]]; then git add affilio_radar/state.json; fi
          if git diff --cached --quiet; then
            echo "No Affilio report/state changes."
            exit 0
          fi
          git commit -m "chore: update Affilio product radar report [skip ci]"
          git pull --rebase origin main
          git push
