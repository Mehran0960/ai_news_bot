name: Affilio Product Radar

on:
  push:
    paths:
      - "affilio_radar/affilio_radar.py"
      - "affilio_radar/product_quality.py"
      - "affilio_radar/affiliate-deal-radar-worker.js"
      - "affilio_radar/affiliate-deal-radar-worker.js"
      - "affilio_radar/short_video.py"
      - "affilio_radar/offerchin_visuals.py"
      - "affilio_radar/assets/retailer-logos/**"
      - "affilio_radar/assets/fonts/**"
      - "affilio_radar/offerchin_audio.py"
      - "affilio_radar/aparat_uploader.py"
      - "affilio_radar/aparat_shorts_migration.py"
      - "affilio_radar/test_aparat_shorts_migration.py"
      - "affilio_radar/state.json"
      - "affilio_radar/test_affilio.py"
      - "affilio_radar/test_expiration_monitor.py"
      - "affilio_radar/test_short_video.py"
      - "affilio_radar/test_aparat_uploader.py"
      - "affilio_radar/expiration_monitor.py"
      - "affilio_radar/content_delivery.py"
      - "affilio_radar/publisher.py"
      - "affilio_radar/platform_registry.py"
      - "affilio_radar/test_content_delivery.py"
      - "affilio_radar/integrity_audit.py"
      - "affilio_radar/integrity_audit_state.py"
      - "affilio_radar/test_integrity_audit.py"
      - ".github/workflows/offerchin-integrity-audit.yml"
      - "affilio_radar/requirements.txt"
      - "affilio_radar/config/products.json"
      - "affilio_radar/README.md"
      - ".github/workflows/affilio-radar.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Queue selected deals for the independent multi-platform publisher"
        required: true
        type: boolean
        default: false
      batch_count:
        description: "Number of posts for a manual run (1–10)"
        required: true
        type: number
        default: 1
      clear_previous_posts:
        description: "Try deleting older public-channel posts before publishing"
        required: true
        type: boolean
        default: false
      external_scheduler:
        description: "Legacy compatibility input; routine discovery is now orchestrated by the publisher workflow"
        required: false
        type: boolean
        default: false
  # Routine discovery is orchestrated as a separate stage by offerchin-publisher.yml.

permissions:
  contents: write

concurrency:
  # Code-only pushes run CI independently; publication/repair pushes and scheduled jobs
  # still serialize all channel mutations with cleanup and countdown refreshes.
  group: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[repair-all-captions]') && 'affilio-channel-updates' || github.event_name == 'push' && !contains(github.event.head_commit.message, '[publish-now]') && !contains(github.event.head_commit.message, '[scan-now]') && !contains(github.event.head_commit.message, '[repair-all-captions]') && !contains(github.event.head_commit.message, '[repair-bale-caption]') && !contains(github.event.head_commit.message, '[aparat-shorts-reconcile]') && !contains(github.event.head_commit.message, '[aparat-shorts-diagnose]') && !contains(github.event.head_commit.message, '[growth-tracking-only]') && format('affilio-ci-{0}', github.run_id) || 'affilio-channel-updates' }}
  # Never preempt a healthy publication run. Stale-run recovery belongs to the Cloudflare dispatcher.
  cancel-in-progress: ${{ false }}

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Code-only pushes test the pushed branch; manual/operational runs stay on main.
          ref: ${{ github.event_name == 'push' && github.ref || 'refs/heads/main' }}
          fetch-depth: 0

      - name: Log automation trigger
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "scheduled_publish=${{ github.event_name == 'schedule' }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: affilio_radar/requirements.txt

      - name: Check optional media tools without blocking channel publication
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[publish-now]') || contains(github.event.head_commit.message, '[scan-now]') || contains(github.event.head_commit.message, '[repair-all-captions]') || contains(github.event.head_commit.message, '[repair-bale-caption]') }}
        run: |
          # Hosted runners already include common fonts and often FFmpeg; verify quickly, never install on the posting path.
          # These are enhancements only: never run apt-get or fail publishing because
          # the package mirror/media tool is unavailable.
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            echo "OPTIONAL_VIDEO_TOOL_UNAVAILABLE: image publishing will continue."
          fi
          for font in NotoSansArabic-Regular.ttf NotoNaskhArabic-Regular.ttf DejaVuSans.ttf; do
            if find /usr/share/fonts/truetype -name "$font" -print -quit 2>/dev/null | grep -q .; then
              echo "PERSIAN_FONT_OK=$font"
              break
            fi
          done

      - name: Install Python dependencies (retry transient package-index failures)
        run: |
          for attempt in 1 2 3; do
            python -m pip install -r affilio_radar/requirements.txt && exit 0
            if [[ "$attempt" -lt 3 ]]; then
              echo "Dependency install attempt $attempt failed; retrying."
              sleep $((attempt * 3))
            fi
          done
          exit 1

      - name: Validate Python syntax (required for safe publishing)
        run: |
          python -m py_compile affilio_radar/affilio_radar.py affilio_radar/product_quality.py affilio_radar/short_video.py affilio_radar/offerchin_visuals.py affilio_radar/offerchin_audio.py affilio_radar/aparat_uploader.py affilio_radar/aparat_shorts_migration.py affilio_radar/expiration_monitor.py affilio_radar/content_delivery.py affilio_radar/publisher.py affilio_radar/platform_registry.py affilio_radar/integrity_audit.py affilio_radar/integrity_audit_state.py affilio_radar/test_integrity_audit.py affilio_radar/test_aparat_upload_schedule.py

      - name: Run regression tests on code pushes only (never in the live publishing path)
        if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[scan-now]') && !contains(github.event.head_commit.message, '[publish-now]') && !contains(github.event.head_commit.message, '[repair-all-captions]') && !contains(github.event.head_commit.message, '[repair-bale-caption]') && !contains(github.event.head_commit.message, '[growth-tracking-only]') }}
        env:
          # Tests must be deterministic even if repository-level env overrides the
          # deployment toggle used by the discovery-only stage.
          AFFILIO_APARAT_UPLOAD_ENABLED: "true"
        run: |
          # These tests call persistence APIs; restore both live files even when a test fails.
          state_backup="$RUNNER_TEMP/offerchin-live-state-before-tests.json"
          candidates_backup="$RUNNER_TEMP/offerchin-live-candidates-before-tests.json"
          cp affilio_radar/state.json "$state_backup"
          cp affilio_radar/candidates.json "$candidates_backup"
          restore_live_files() {
            cp "$state_backup" "$GITHUB_WORKSPACE/affilio_radar/state.json"
            cp "$candidates_backup" "$GITHUB_WORKSPACE/affilio_radar/candidates.json"
          }
          trap restore_live_files EXIT
          cd affilio_radar
          python -m unittest -v test_affilio.py test_expiration_monitor.py test_short_video.py test_aparat_uploader.py test_aparat_shorts_migration.py test_aparat_upload_schedule.py test_content_delivery.py test_integrity_audit.py

      - name: Smoke-test the deployed click tracker (diagnostic only)
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          from urllib.parse import quote, urlsplit
          import requests

          base = os.getenv(
              "AFFILIO_CLICK_TRACKER_BASE_URL",
              "https://affiliate-deal-radar.m-hoseyni-6966.workers.dev",
          ).rstrip("/")
          # This UA is intentionally bot-like so probes never count as customer clicks.
          headers = {"User-Agent": "Bot"}
          health = requests.get(f"{base}/health", timeout=20, headers=headers)
          health.raise_for_status()
          status = health.json()
          assert status.get("ok") is True, status
          assert status.get("clickStoreReady") is True, status
          print("CLICK_TRACKER_HEALTH_OK")

          # Product-level demand ranking depends on a complete, parseable 30-day snapshot.
          # This catches regressions where stored click keys are written but never aggregated.
          stats_response = requests.get(f"{base}/stats", timeout=30, headers=headers)
          stats_response.raise_for_status()
          stats = stats_response.json()
          assert stats.get("ok") is True, stats
          assert stats.get("complete") is True, stats
          assert isinstance(stats.get("products"), dict), stats
          assert all(
              __import__("re").fullmatch(r"(?:dkp-\\d{1,12}|snp-\\d{1,20})", str(pid))
              for pid in stats["products"]
          ), "click statistics contain invalid product IDs"
          print(
              f"CLICK_TRACKER_STATS_OK total_clicks={stats.get('totalClicks', 0)} "
              f"products={len(stats['products'])}"
          )

          bad = requests.get(
              f"{base}/p/dkp-15970075",
              params={"u": "https://example.com/"},
              headers=headers,
              allow_redirects=False,
              timeout=20,
          )
          assert bad.status_code == 400, (bad.status_code, bad.text[:200])
          print("CLICK_TRACKER_REJECTS_UNTRUSTED_DESTINATION")

          samples = (
              (
                  "dkp-15970075",
                  "https://www.digikala.com/product/dkp-15970075/",
                  "telegram",
              ),
              (
                  "snp-2097083854",
                  "https://snappshop.ir/product/snp-2097083854",
                  "bale",
              ),
          )
          for product_id, product_url, source in samples:
              publisher_link = "https://aflo.ir/QekEYTRg?p=" + quote(product_url, safe="")
              good = requests.get(
                  f"{base}/p/{product_id}",
                  params={"u": publisher_link, "src": source},
                  headers=headers,
                  allow_redirects=False,
                  timeout=20,
              )
              assert good.status_code == 302, (product_id, good.status_code, good.text[:200])
              location = urlsplit(good.headers.get("Location", ""))
              assert location.scheme == "https" and location.hostname == "aflo.ir", (
                  product_id, good.headers.get("Location")
              )
              assert location.path == "/QekEYTRg", (product_id, location.path)
              assert location.query.startswith("p="), (product_id, location.query)
              print(f"CLICK_TRACKER_VALID_AFFILIO_REDIRECT_OK product={product_id} source={source}")

              # The production Python publisher uses the same non-counting HEAD probe before wrapping buttons.
              probe = requests.head(
                  f"{base}/p/{product_id}",
                  params={"u": publisher_link, "src": source},
                  headers={"User-Agent": "OfferChinClickTrackerProbe/1.0"},
                  allow_redirects=False,
                  timeout=20,
              )
              assert probe.status_code == 302, (product_id, probe.status_code, probe.text[:200])
              probe_location = urlsplit(probe.headers.get("Location", ""))
              assert probe_location.hostname == "aflo.ir" and probe_location.path == "/QekEYTRg", (
                  product_id, probe.headers.get("Location")
              )
              print(f"CLICK_TRACKER_HEAD_PROBE_OK product={product_id} source={source}")

          stats = requests.get(f"{base}/stats", timeout=20, headers=headers)
          stats.raise_for_status()
          analytics = stats.json()
          assert analytics.get("ok") is True, analytics
          assert isinstance(analytics.get("products"), dict), analytics
          assert isinstance(analytics.get("totalClicks"), int), analytics
          assert analytics.get("complete") is True, analytics
          assert "channels" not in analytics and "productChannels" not in analytics, analytics
          print("CLICK_TRACKER_AGGREGATE_STATS_OK_SOURCE_BREAKDOWN_NOT_PUBLIC")
          PY
      # [repair-all-captions] Repairs every surviving caption without timers and restores its verified purchase button.
      # [repair-all-captions] Remove obsolete expiry labels from every tracked live caption in place.
      # [scan-now] Runs a fresh direct-feed timer diagnostic and eligibility-checked publication pass.
      - name: Discover, verify and queue selected products (never publish from this workflow)
        # Normal code pushes run tests above, but must not consume a full product-discovery cycle.
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-now]') || contains(github.event.head_commit.message, '[scan-now]') || contains(github.event.head_commit.message, '[repair-bale-caption]') || contains(github.event.head_commit.message, '[repair-all-captions]') || contains(github.event.head_commit.message, '[growth-tracking-only]') || contains(github.event.head_commit.message, '[repair-persian-video-text]') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AFFILIO_TELEGRAM_CHAT_ID: "@OfferChin"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          APARAT_COOKIE_HEADER: ${{ secrets.APARAT_COOKIE_HEADER }}
          # Aparat uploads are handled by the independent Aparat-video-upload workflow.
          # This radar path remains responsible for YouTube and the public channels only.
          AFFILIO_APARAT_UPLOAD_ENABLED: "false"
          APARAT_SHORTS_ONLY: "false"
          APARAT_VIDEO_PASS: "0"
          AFFILIO_APARAT_UPLOAD_INTERVAL_HOURS: "3"
          APARAT_CATEGORY_ID: ${{ vars.APARAT_CATEGORY_ID || '5' }}
          AFFILIO_VIDEO_REVIEW_CHAT_ID: ${{ secrets.AFFILIO_VIDEO_REVIEW_CHAT_ID }}
          # Publish generated vertical videos publicly; YouTube classifies vertical videos up to 3 minutes as Shorts.
          YOUTUBE_PRIVACY_STATUS: "public"
          AFFILIO_YOUTUBE_UPLOAD_INTERVAL_HOURS: "3"
          AFFILIO_MIN_DISCOUNT_PERCENT: "50"
          AFFILIO_DEAL_LIST_PAGES: "5"
          AFFILIO_MAX_PER_QUERY: "12"
          AFFILIO_SNAPPSHOP_QUERIES_PER_SCAN: "4"
          # Keep stale-price auditing bounded so it cannot starve the radar.
          AFFILIO_PRICE_AUDIT_BATCH_SIZE: "10"
          AFFILIO_PRICE_AUDIT_INTERVAL_SECONDS: "3600"
          AFFILIO_PRICE_AUDIT_RETRY_SECONDS: "900"
          AFFILIO_DIRECT_PRODUCT_DETAIL_CHECK_LIMIT: "1"
          AFFILIO_MAX_PRODUCT_CHECKS: "90"
          AFFILIO_MAX_INCREDIBLE_OFFER_CANDIDATES: "90"
          AFFILIO_MAX_QUEUED_RECHECKS: "16"
          AFFILIO_PENDING_QUEUE_LIMIT: "200"
          AFFILIO_DISCOVERY_QUEUE_LIMIT: "1000"
          AFFILIO_CONTENT_DELIVERY_QUEUE_LIMIT: "6"
          AFFILIO_DISCOVERY_QUEUE_TTL_HOURS: "24"
          AFFILIO_MAX_DISCOVERY_QUEUE_CHECKS: "64"
          AFFILIO_MCP_PAGES_PER_SCAN: "5"
          AFFILIO_AUTOPUBLISH: "false"
          AFFILIO_MIN_POST_INTERVAL_HOURS: "0.3333333333333333"
          AFFILIO_MIN_PUBLICATION_RUNWAY_MINUTES: "60"
          AFFILIO_COUNTDOWN_SAFETY_BUFFER_MINUTES: "10"
          AFFILIO_FORCE_DEADLINE_SYNC: ${{ contains(github.event.head_commit.message, '[repair-all-captions]') && 'true' || 'false' }}
          AFFILIO_MAX_POSTS_PER_RUN: ${{ contains(github.event.head_commit.message, '[publish-now]') && '10' || inputs.batch_count || (github.event_name == 'schedule' && '2' || '1') }}
          AFFILIO_PUBLISH_BACKLOG_BURST_THRESHOLD: "8"
          AFFILIO_PUBLISH_BACKLOG_BURST_MAX_POSTS: "2"
          AFFILIO_MAX_PUBLISH_CANDIDATE_ATTEMPTS: "10"
          # Historical posts are removed only by verified expiry. A manual workflow_dispatch
          # may opt into the legacy Telegram cleanup; scheduled scans never clear channel history.
          AFFILIO_CLEAR_PREVIOUS_CHANNEL_POSTS: ${{ github.event_name == 'workflow_dispatch' && inputs.clear_previous_posts == true }}
          AFFILIO_BATCH_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.clear_previous_posts == true && github.run_id || '' }}
          AFFILIO_FORCE_POST_COOLDOWN_BYPASS: ${{ contains(github.event.head_commit.message, '[publish-now]') || inputs.publish }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [[ "${{ contains(github.event.head_commit.message, '[repair-all-captions]') }}" == "true" ]]; then
            # Ensure the report belongs to this repair run, then clean expired posts and repair active ones.
            rm -f affilio_radar/affiliate_link_repair_report.json
            python affilio_radar/expiration_monitor.py
            python affilio_radar/affilio_radar.py --repair-all-captions
          elif [[ "${{ contains(github.event.head_commit.message, '[repair-persian-video-text]') }}" == "true" ]]; then
            python affilio_radar/affilio_radar.py --repair-persian-video-text
          elif [[ "${{ contains(github.event.head_commit.message, '[repair-bale-caption]') }}" == "true" ]]; then
            python affilio_radar/affilio_radar.py --repair-bale-message-id 2
          elif [[ "${{ contains(github.event.head_commit.message, '[growth-tracking-only]') }}" == "true" ]]; then
            python affilio_radar/affilio_radar.py --setup-growth-invites
          else
            # This stage only discovers, validates, ranks and persists selected content.
            # All channel/video delivery and stale-post cleanup run in their own workflows.
            python affilio_radar/affilio_radar.py --select-only
          fi

      - name: Preserve generated vertical MP4 artifacts and upload outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offerchin-short-videos-${{ github.run_id }}
          path: video_artifacts/*.mp4
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit candidate report and state only when changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only operational scans/repairs may commit live state. Test-only code pushes
          # must never serialize a test fixture over the real channel history.
                    if [[ "${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-now]') || contains(github.event.head_commit.message, '[scan-now]') || contains(github.event.head_commit.message, '[repair-all-captions]') || contains(github.event.head_commit.message, '[repair-bale-caption]') || contains(github.event.head_commit.message, '[growth-tracking-only]') || contains(github.event.head_commit.message, '[aparat-shorts-reconcile]') || contains(github.event.head_commit.message, '[aparat-shorts-diagnose]') || contains(github.event.head_commit.message, '[repair-persian-video-text]') }}" == "true" && -f affilio_radar/diversity_report.json ]]; then
            python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report_path = Path("affilio_radar/diversity_report.json")

          def normalized(raw):
              def clean(value):
                  if isinstance(value, dict):
                      return {
                          key: clean(item)
                          for key, item in value.items()
                          if key not in {"generated_at", "checked_at", "updated_at"}
                          and not key.endswith("_checked_at")
                          and not key.endswith("_updated_at")
                      }
                  if isinstance(value, list):
                      return [clean(item) for item in value]
                  return value
              return json.dumps(clean(json.loads(raw)), ensure_ascii=False, sort_keys=True, separators=(",", ":"))

          current_report = report_path.read_text(encoding="utf-8")
          previous = subprocess.run(
              ["git", "show", "HEAD:affilio_radar/diversity_report.json"],
              capture_output=True, text=True, check=False,
          )
          if previous.returncode != 0 or normalized(previous.stdout) != normalized(current_report):
              subprocess.run(["git", "add", str(report_path)], check=True)
              print("Publication diversity report has material changes; staging it.")
          else:
              subprocess.run(["git", "restore", "--worktree", "--", str(report_path)], check=True)
              print("Diversity report only has timestamp changes; restored the previous report.")
          PY
          fi
          if [[ "${{ contains(github.event.head_commit.message, '[repair-all-captions]') }}" == "true" && -f affilio_radar/affiliate_link_repair_report.json ]]; then
            git add affilio_radar/affiliate_link_repair_report.json
          fi
          # Persist first-party logo files downloaded by the bootstrap path; future runs are offline for logos.
          if [[ -d affilio_radar/assets/retailer-logos ]]; then
            git add affilio_radar/assets/retailer-logos
          fi
          # The live scan writes the selected-candidate handoff and its discovery
          # state as well as the diversity report. Persist all three atomically so
          # the publisher can consume the fresh selection on its next run.
          if [[ "${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-now]') || contains(github.event.head_commit.message, '[scan-now]') }}" == "true" ]]; then
            for path in affilio_radar/candidates.json affilio_radar/state.json; do
              if [[ -f "$path" ]] && ! git diff --quiet -- "$path"; then
                git add "$path"
              fi
            done
          fi
          if git diff --cached --quiet; then
            echo "No material Affilio report/state changes."
            exit 0
          fi
          git commit -m "chore: persist live Affilio discovery handoff [skip ci]"
          # Another scheduled job may have advanced main while this scan ran.
          # Autostash preserves any generated-but-not-staged operational files
          # during the rebase instead of failing with "unstaged changes".
          git pull --rebase --autostash origin main
          git push
