name: Affilio Product Radar

on:
  push:
    paths:
      - "affilio_radar/affilio_radar.py"
      - "affilio_radar/short_video.py"
      - "affilio_radar/offerchin_visuals.py"
      - "affilio_radar/offerchin_audio.py"
      - "affilio_radar/aparat_uploader.py"
      - "affilio_radar/aparat_shorts_migration.py"
      - "affilio_radar/test_aparat_shorts_migration.py"
      - "affilio_radar/state.json"
      - "affilio_radar/test_affilio.py"
      - "affilio_radar/test_expiration_monitor.py"
      - "affilio_radar/test_short_video.py"
      - "affilio_radar/test_aparat_uploader.py"
      - "affilio_radar/expiration_monitor.py"
      - "affilio_radar/requirements.txt"
      - "affilio_radar/config/products.json"
      - "affilio_radar/README.md"
      - ".github/workflows/affilio-radar.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish image deals to @OfferChin"
        required: true
        type: boolean
        default: false
      batch_count:
        description: "Number of posts for a manual run (1–10)"
        required: true
        type: number
        default: 1
      clear_previous_posts:
        description: "Try deleting older public-channel posts before publishing"
        required: true
        type: boolean
        default: false
      external_scheduler:
        description: "One-minute Cloudflare scheduler trigger; product scans run every five minutes and normal posts can publish on every successful scan"
        required: false
        type: boolean
        default: false
  schedule:
    # Scan all selected feed pages every five minutes. Expiry cleanup is schedule/manual-only to avoid code-push contention.
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  # Code-only pushes run CI independently; publication/repair pushes and scheduled jobs
  # still serialize all channel mutations with cleanup and countdown refreshes.
  group: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[publish-now]') && !contains(github.event.head_commit.message, '[scan-now]') && !contains(github.event.head_commit.message, '[repair-all-captions]') && !contains(github.event.head_commit.message, '[repair-bale-caption]') && !contains(github.event.head_commit.message, '[aparat-shorts-reconcile]') && !contains(github.event.head_commit.message, '[aparat-shorts-diagnose]') && !contains(github.event.head_commit.message, '[growth-tracking-only]') && format('affilio-ci-{0}', github.run_id) || 'affilio-channel-updates' }}
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Log automation trigger
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "scheduled_publish=${{ github.event_name == 'schedule' }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Persian font for the discount badge
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-core
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get install -y --no-install-recommends ffmpeg; fi

      - name: Install Python dependencies
        run: python -m pip install -r affilio_radar/requirements.txt

      - name: Validate syntax and run unit tests
        if: ${{ github.event_name != 'schedule' }}
        run: |
          python -m py_compile affilio_radar/affilio_radar.py affilio_radar/short_video.py affilio_radar/offerchin_visuals.py affilio_radar/offerchin_audio.py affilio_radar/aparat_uploader.py affilio_radar/aparat_shorts_migration.py
          cd affilio_radar
          python -m unittest -v test_affilio.py test_expiration_monitor.py test_short_video.py test_aparat_uploader.py test_aparat_shorts_migration.py
          python -m py_compile expiration_monitor.py

      - name: Smoke-test the deployed click tracker
        if: ${{ github.event_name == 'push' }}
        run: |
          python - <<'PY'
          import os
          import requests

          base = os.getenv(
              "AFFILIO_CLICK_TRACKER_BASE_URL",
              "https://affiliate-deal-radar.m-hoseyni-6966.workers.dev",
          ).rstrip("/")
          headers = {"User-Agent": "Bot"}
          health = requests.get(f"{base}/health", timeout=20, headers=headers)
          health.raise_for_status()
          status = health.json()
          assert status.get("ok") is True, status
          assert status.get("clickStoreReady") is True, status
          print("CLICK_TRACKER_HEALTH_OK")

          product_id = "dkp-15970075"
          bad = requests.get(
              f"{base}/p/{product_id}",
              params={"u": "https://example.com/"},
              headers=headers,
              allow_redirects=False,
              timeout=20,
          )
          assert bad.status_code == 400, (bad.status_code, bad.text[:200])
          print("CLICK_TRACKER_REJECTS_UNTRUSTED_DESTINATION")

          destination = (
              f"https://www.digikala.com/product/{product_id}/"
              "?utm_source=19166&utm_medium=Affilio&utm_id=14657"
              "&affid=OTgxYTY0OTAtODJhNS00MDNkLTg0NDItMWE0MGVkOGI1Yjhj"
          )
          good = requests.get(
              f"{base}/p/{product_id}",
              params={"u": destination},
              headers=headers,
              allow_redirects=False,
              timeout=20,
          )
          assert good.status_code == 302, (good.status_code, good.text[:200])
          assert good.headers.get("Location", "").startswith(
              f"https://www.digikala.com/product/{product_id}/"
          ), good.headers.get("Location")
          print("CLICK_TRACKER_VALID_REDIRECT_OK")

          stats = requests.get(f"{base}/stats", timeout=20, headers=headers)
          stats.raise_for_status()
          analytics = stats.json()
          assert analytics.get("ok") is True, analytics
          assert isinstance(analytics.get("products"), dict), analytics
          assert isinstance(analytics.get("totalClicks"), int), analytics
          print("CLICK_TRACKER_AGGREGATED_STATS_OK")
          PY

      # [repair-all-captions] Final sweep includes newly published posts and reports unavailable IDs.
      # A commit tagged [scan-now] runs one fresh eligibility-checked scan; at most one product posts.
      - name: Discover products, verify stock, compare current market prices, and publish one image if enabled
        # Normal code pushes run tests above, but must not consume a full product-discovery cycle.
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-now]') || contains(github.event.head_commit.message, '[scan-now]') || contains(github.event.head_commit.message, '[repair-bale-caption]') || contains(github.event.head_commit.message, '[repair-all-captions]') || contains(github.event.head_commit.message, '[growth-tracking-only]') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AFFILIO_TELEGRAM_CHAT_ID: "@OfferChin"
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ secrets.BALE_CHANNEL_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          APARAT_COOKIE_HEADER: ${{ secrets.APARAT_COOKIE_HEADER }}
          # Do not confuse the generic Aparat web feed with Aparat Shorts.
          # Shorts uploads must be completed through the official mobile app.
          APARAT_SHORTS_ONLY: "true"
          APARAT_VIDEO_PASS: "0"
          APARAT_CATEGORY_ID: ${{ vars.APARAT_CATEGORY_ID || '5' }}
          AFFILIO_VIDEO_REVIEW_CHAT_ID: ${{ secrets.AFFILIO_VIDEO_REVIEW_CHAT_ID }}
          # Publish generated vertical videos publicly; YouTube classifies vertical videos up to 3 minutes as Shorts.
          YOUTUBE_PRIVACY_STATUS: "public"
          AFFILIO_DEAL_LIST_PAGES: "5"
          AFFILIO_MAX_PRODUCT_CHECKS: "40"
          AFFILIO_MAX_INCREDIBLE_OFFER_CANDIDATES: "32"
          AFFILIO_MAX_QUEUED_RECHECKS: "8"
          AFFILIO_PENDING_QUEUE_LIMIT: "200"
          AFFILIO_DISCOVERY_QUEUE_LIMIT: "500"
          AFFILIO_DISCOVERY_QUEUE_TTL_HOURS: "24"
          AFFILIO_MAX_DISCOVERY_QUEUE_CHECKS: "24"
          AFFILIO_MCP_PAGES_PER_SCAN: "2"
          AFFILIO_AUTOPUBLISH: ${{ github.event_name == 'schedule' || inputs.publish || inputs.external_scheduler || contains(github.event.head_commit.message, '[publish-now]') || contains(github.event.head_commit.message, '[scan-now]') }}
          AFFILIO_MIN_POST_INTERVAL_HOURS: "0.08333333333333333"
          AFFILIO_MIN_PUBLICATION_RUNWAY_MINUTES: "60"
          AFFILIO_COUNTDOWN_SAFETY_BUFFER_MINUTES: "10"
          AFFILIO_MAX_POSTS_PER_RUN: ${{ contains(github.event.head_commit.message, '[publish-now]') && '10' || inputs.batch_count || (github.event_name == 'schedule' && '2' || '1') }}
          AFFILIO_PUBLISH_BACKLOG_BURST_THRESHOLD: "8"
          AFFILIO_PUBLISH_BACKLOG_BURST_MAX_POSTS: "2"
          AFFILIO_MAX_PUBLISH_CANDIDATE_ATTEMPTS: "4"
          AFFILIO_CLEAR_PREVIOUS_CHANNEL_POSTS: ${{ contains(github.event.head_commit.message, '[publish-now]') || inputs.clear_previous_posts }}
          AFFILIO_BATCH_KEY: ${{ contains(github.event.head_commit.message, '[publish-now]') && github.sha || github.run_id }}
          AFFILIO_FORCE_POST_COOLDOWN_BYPASS: ${{ contains(github.event.head_commit.message, '[publish-now]') || inputs.publish }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [[ "${{ contains(github.event.head_commit.message, '[repair-all-captions]') }}" == "true" ]]; then
            # Ensure the report belongs to this repair run, then clean expired posts and repair active ones.
            rm -f affilio_radar/affiliate_link_repair_report.json
            python affilio_radar/expiration_monitor.py
            python affilio_radar/affilio_radar.py --repair-all-captions
          elif [[ "${{ contains(github.event.head_commit.message, '[repair-bale-caption]') }}" == "true" ]]; then
            python affilio_radar/affilio_radar.py --repair-bale-message-id 2
          elif [[ "${{ contains(github.event.head_commit.message, '[growth-tracking-only]') }}" == "true" ]]; then
            python affilio_radar/affilio_radar.py --setup-growth-invites
          else
            python affilio_radar/affilio_radar.py
          fi

      - name: Preserve generated vertical MP4 artifacts and upload outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offerchin-short-videos-${{ github.run_id }}
          path: video_artifacts/*.mp4
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit candidate report and state only when changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${{ contains(github.event.head_commit.message, '[repair-all-captions]') }}" != "true" && -f affilio_radar/state.json ]]; then
            git add affilio_radar/state.json
          fi
          # Commit the report only when actual offer data changed, not on per-scan timestamps.
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report_path = Path("affilio_radar/candidates.json")

          def normalized(raw):
              def clean(value):
                  if isinstance(value, dict):
                      return {
                          key: clean(item)
                          for key, item in value.items()
                          if key not in {"generated_at", "checked_at", "updated_at"}
                          and not key.endswith("_checked_at")
                          and not key.endswith("_updated_at")
                      }
                  if isinstance(value, list):
                      return [clean(item) for item in value]
                  return value
              return json.dumps(clean(json.loads(raw)), ensure_ascii=False, sort_keys=True, separators=(",", ":"))

          current_report = report_path.read_text(encoding="utf-8")
          previous = subprocess.run(
              ["git", "show", "HEAD:affilio_radar/candidates.json"],
              capture_output=True, text=True, check=False,
          )
          if previous.returncode != 0 or normalized(previous.stdout) != normalized(current_report):
              subprocess.run(["git", "add", str(report_path)], check=True)
              print("Candidate report has material changes; staging it.")
          else:
              print("Candidate report only has scan-time changes; leaving it unstaged.")
          PY
          if [[ "${{ contains(github.event.head_commit.message, '[repair-all-captions]') }}" == "true" && -f affilio_radar/affiliate_link_repair_report.json ]]; then
            git add affilio_radar/affiliate_link_repair_report.json
          fi
          if git diff --cached --quiet; then
            echo "No material Affilio report/state changes."
            exit 0
          fi
          git commit -m "chore: update Affilio product radar report [skip ci]"
          git pull --rebase origin main
          git push
