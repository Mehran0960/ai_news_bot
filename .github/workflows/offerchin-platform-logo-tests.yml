name: OfferChin Platform Logo Regression Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "affilio_radar/offerchin_visuals.py"
      - "affilio_radar/affilio_radar.py"
      - "affilio_radar/short_video.py"
      - "affilio_radar/aparat_uploader.py"
      - "affilio_radar/filo_uploader.py"
      - "affilio_radar/test_filo_uploader.py"
      - "affilio_radar/test_filo_upload_schedule.py"
      - "affilio_radar/assets/platform-logos/**"
      - ".github/workflows/sync-official-platform-logos.yml"
      - "affilio_radar/test_affilio.py"
      - "affilio_radar/test_short_video.py"
      - ".github/workflows/offerchin-platform-logo-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-logo-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: affilio_radar/requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r affilio_radar/requirements.txt
      - name: Compile renderers and run logo/video regression tests
        run: |
          python -m py_compile \
            affilio_radar/offerchin_visuals.py \
            affilio_radar/affilio_radar.py \
            affilio_radar/short_video.py \
            affilio_radar/filo_uploader.py
          cd affilio_radar
          python -m unittest -v test_short_video.py
          python -m unittest -v test_filo_uploader.py test_filo_upload_schedule.py
          python -m unittest -v test_affilio.AffilioRadarTests.test_channel_watermarks_exclude_the_destination_and_show_other_four_platforms
          python -m unittest -v test_affilio.AffilioRadarTests.test_simultaneous_youtube_and_aparat_uploads_render_separate_destination_posters
