name: MeMarket Deal Radar

on:
  push:
    paths:
      - "memarket_radar/memarket_deal_radar.py"
      - ".github/workflows/memarket-deal-radar.yml"
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: memarket-deal-radar
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run MeMarket radar
        env:
          MEMARKET_AFFILIATE_CODE: ${{ secrets.MEMARKET_AFFILIATE_CODE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROBE_STOCK_ALL: "true"
          PROBE_REPORT_TELEGRAM: "false"
        run: python memarket_radar/memarket_deal_radar.py
