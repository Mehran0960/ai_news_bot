name: Dayan Source Message Inspection

on:
  push:
    paths:
      - ".github/dayan-source-inspect.txt"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r dayan-affiliate-relay/requirements.txt

      - name: Inspect source message without posting
        run: |
          set -euo pipefail
          message_id="$(tr -d '[:space:]' < .github/dayan-source-inspect.txt)"
          python dayan-affiliate-relay/relay_botapi.py --inspect-message "$message_id"
