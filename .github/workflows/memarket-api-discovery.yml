name: MeMarket API Discovery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/memarket-api-discovery.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Discover
        shell: bash
        run: |
          python - <<'PY'
          import html, re, urllib.request
          from urllib.parse import urljoin
          
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"text/html,application/javascript,*/*"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read().decode("utf-8","ignore")
          
          page=get("https://aff.memarket24.ir/login")
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',page,re.I)
          print("SCRIPTS",srcs[:10])
          for src in srcs[:10]:
              url=urljoin("https://aff.memarket24.ir/login",src)
              js=get(url)
              print("JS_URL",url)
              print("JS_BYTES",len(js))
              urls=sorted(set(re.findall(r'https?://[^"\'\\s<>]{1,220}',js)))
              print("ABS_URLS")
              for x in urls[:100]: print(x)
              print("REL_PATHS")
              rel=sorted(set(re.findall(r'["\'](/[^"\']*(?:api|login|auth|product|goods|commission|order|affiliate)[^"\']*)["\']',js,re.I)))
              for x in rel[:200]: print(x)
              print("KEY_CONTEXT")
              for term in ("baseURL","api/","login","goods","product","commission","order","affiliate","token"):
                  positions=[m.start() for m in re.finditer(re.escape(term),js,re.I)]
                  print("TERM",term,"COUNT",len(positions))
                  for p in positions[:2]:
                      ctx=re.sub(r'\\s+',' ',js[max(0,p-220):p+500])
                      print(ctx[:720])
          PY
