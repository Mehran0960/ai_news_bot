name: MeMarket API Discovery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/memarket-api-discovery.yml"
      - "memarket_radar/channel_probe.py"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Discover
        shell: bash
        run: |
          python - <<'PY'
          import html, re, urllib.request
          from urllib.parse import urljoin
          
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"text/html,application/javascript,*/*"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read().decode("utf-8","ignore")
          
          page=get("https://aff.memarket24.ir/login")
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',page,re.I)
          print("SCRIPTS",srcs[:10])
          print("CONFIG_KEYS")
          for term in ("BaseUrl","SecondaryBaseUrl","BaseUrlDomain","BASE_API"):
              pos=[m.start() for m in re.finditer(term,page,re.I)]
              print("PAGE_TERM",term,"COUNT",len(pos))
              for p in pos[:5]:
                  print(re.sub(r"\\s+"," ",page[max(0,p-250):p+500])[:900])
          for src in srcs[:10]:
              url=urljoin("https://aff.memarket24.ir/login",src)
              js=get(url)
              print("JS_URL",url)
              print("JS_BYTES",len(js))
              urls=sorted(set(re.findall(r'https?://[^"\'\\s<>]{1,220}',js)))
              print("ABS_URLS")
              for x in urls[:100]: print(x)
              print("REL_PATHS")
              rel=sorted(set(re.findall(r'["\'](/[^"\']*(?:api|login|auth|product|goods|commission|order|affiliate)[^"\']*)["\']',js,re.I)))
              for x in rel[:200]: print(x)
              print("KEY_CONTEXT")
              for term in ("baseURL","api/","login","goods","product","commission","order","affiliate","token"):
                  positions=[m.start() for m in re.finditer(re.escape(term),js,re.I)]
                  print("TERM",term,"COUNT",len(positions))
                  for p in positions[:2]:
                      ctx=re.sub(r'\\s+',' ',js[max(0,p-220):p+500])
                      print(ctx[:720])
          PY

          echo "API_CALL_SCAN"
          python - <<'PY2'
          import re, urllib.request
          req=urllib.request.Request("https://aff.memarket24.ir/_nuxt/BuKelfsT.js",headers={"User-Agent":"Mozilla/5.0"})
          js=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","ignore")
          pat = r"api\.(?:get|post|put|patch|delete)\(\s*['\"]([^'\"]{1,220})"
          found=set(re.findall(pat,js,re.I))
          for x in sorted(found):
              if any(k in x.lower() for k in ("login","good","product","commission","order","affiliate","user","auth")):
                  print("API_CALL",x)
          PY2

          echo "TARGETED_CONTEXT"
          python - <<'PY3'
          import re, urllib.request
          req=urllib.request.Request("https://aff.memarket24.ir/_nuxt/BuKelfsT.js",headers={"User-Agent":"Mozilla/5.0"})
          js=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","ignore")
          for term in ("login","GetGoodParentOnlyWithSellInfoGroupedDetailWithInventory","GetSellerSoldParentGoodForWmP"):
              print("TARGET",term)
              positions=[m.start() for m in re.finditer(re.escape(term),js,re.I)]
              print("COUNT",len(positions))
              for p in positions[:10]:
                  print(re.sub(r"\\s+"," ",js[max(0,p-500):p+1200])[:1800])
          print("API_METHOD_CONTEXTS_NEAR_LOGIN")
          for m in re.finditer(r"api\\.(?:get|post|put|patch|delete)\\(",js,re.I):
              ctx=js[m.start():m.start()+900]
              if re.search("login",ctx,re.I):
                  print(re.sub(r"\\s+"," ",ctx)[:1200])
          PY3

          echo "CHUNK_SCAN"
          python - <<'PY4'
          import re, urllib.request
          chunks=["Db458ClI.js","StH02Apt.js","D3XhxgFx.js"]
          for name in chunks:
              url="https://aff.memarket24.ir/_nuxt/"+name
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                  js=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","ignore")
                  print("CHUNK",name,"BYTES",len(js))
                  for kind in ("get","post","put","patch","delete"):
                      for m in re.finditer(r"api\\."+kind+r"\\(",js,re.I):
                          ctx=js[m.start():m.start()+1800]
                          if any(k in ctx.lower() for k in ("login","good","product","commission","order","auth","token","user")):
                              print("CALL",kind.upper(),re.sub(r"\\s+"," ",ctx)[:1600])
              except Exception as e:
                  print("CHUNK_ERROR",name,type(e).__name__,str(e))
          PY4

          echo "LOGIN_CHUNK_DIRECT"
          python - <<'PY5'
          import urllib.request
          url="https://aff.memarket24.ir/_nuxt/Db458ClI.js"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          js=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","ignore")
          print("LOGIN_CHUNK_BYTES",len(js))
          for needle in ("apishared.post(", "api.post(", "Login", "Check"):
              print("NEEDLE",needle,"COUNT",js.lower().count(needle.lower()))
          start=0
          seen=0
          while True:
              i=js.find("post(",start)
              if i<0 or seen>=20: break
              ctx=js[max(0,i-300):i+900].replace("\\n"," ")
              print("POST_CTX",ctx[:1200])
              start=i+5
              seen+=1
          PY5
