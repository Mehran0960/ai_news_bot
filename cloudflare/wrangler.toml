name = "affilio-minute-dispatcher"
main = "affilio-minute-dispatcher.js"
compatibility_date = "2026-10-17"
workers_dev = false
keep_vars = true

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
head_sampling_rate = 1.0

[observability.logs]
enabled = true
head_sampling_rate = 1.0
invocation_logs = true
persist = true

# The canonical source file uses ESM syntax but retains its .js name for compatibility.
# Explicitly classify JavaScript entrypoints as ES modules (Wrangler defaults .js to CommonJS).
[[rules]]
type = "ESModule"
globs = ["**/*.js"]
